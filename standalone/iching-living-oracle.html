ng leads to misfortune."}]},{"n":33,"zh":"遯","pinyin":"Dùn","legge":"Thun","name":"Retreat","alt":"Withdrawal","glyph":"䷠","lower":"gen","upper":"qian","bits":"001111","keywords":["retreat","withdrawal","distance","self-preservation","timing"],"core":"a time to step back from an unfavourable situation, withdrawing with dignity to preserve your strength","now":"Mountain beneath heaven: the mountain rises, but heaven withdraws before it. Retreat describes a time when opposing forces are growing stronger and continued engagement would waste your energy. The traditional text says that success lies in withdrawal, and that only in small matters is it still useful to persist. Retreat is not defeat. It is a deliberate choice to create distance, keep your dignity and preserve your strength for a better moment. The Image adds an important detail: the wise person keeps petty people at a distance, not with hatred, but with calm reserve.","dir":"The situation may be moving toward a time when stepping back is wiser than pushing on. Creating distance, without bitterness, can protect your energy and independence.","do":["Recognize when continued effort is no longer productive","Withdraw calmly and without resentment","Keep your dignity and your options open"],"avoid":["Staying too long out of pride or habit","Leaving in anger or creating enemies"],"love":"If a relationship is draining or one-sided, some distance may help both people see clearly. Step back with kindness, not punishment.","work":"A project, role or negotiation may no longer be worth the cost. Plan an orderly exit or reduce your involvement without burning bridges.","self":"Protect your energy. Saying no to some things is a way of saying yes to yourself.","jung":"Psychologically, Retreat may describe the healthy withdrawal of energy from an outer situation that no longer holds meaning, so that it can turn inward and be renewed. Jung saw such periods of introversion as a natural phase of growth, not a failure.","example":"Leaving a job with a toxic culture, stepping back from a family argument, or ending a commitment that has become an obligation without purpose.","judgment":"Thun indicates successful progress (in its circumstances). To a small extent it will (still) be advantageous to be firm and correct.","image":"(The trigram representing) the sky and below it that for a mountain form Thun. The superior man, in accordance with this, keeps small men at a distance, not by showing that he hates them, but by his own dignified gravity.","lines":[{"legge":"The first SIX, divided, shows a retiring tail. The position is perilous. No movement in any direction should be made.","plain":"The tail end of a retreat: you are the last to leave and the most exposed. This is dangerous. Do not start anything new now; simply get out of harm's way quietly."},{"legge":"The second SIX, divided, shows its subject holding (his purpose) fast as if by a (thong made from the) hide of a yellow ox, which cannot be broken.","plain":"Held fast as if by a strap of yellow oxhide that cannot be broken. A firm commitment or loyalty holds you in place. Here, staying true to what binds you is right, even while others withdraw."},{"legge":"The third NINE, undivided, shows one retiring but bound,--to his distress and peril. (If he were to deal with his binders as in) nourishing a servant or concubine, it would be fortunate for him.","plain":"A retreat that is held back by ties and obligations, which is stressful and dangerous. Treat the people who hold you back kindly, as you would care for those who depend on you, and the situation can turn out well."},{"legge":"The fourth NINE, undivided, shows its subject retiring notwithstanding his likings. In a superior man this will lead to good fortune; a small man cannot attain to this.","plain":"Voluntary retreat, even from something you like. A mature person can let go of what they enjoy when the time is right and finds good fortune in it. Someone ruled by desire cannot."},{"legge":"The fifth NINE, undivided, shows its subject retiring in an admirable way. With firm correctness there will be good fortune.","plain":"A friendly, well-timed retreat. Leaving at the right moment, with courtesy and firm purpose, brings good fortune."},{"legge":"The sixth NINE, undivided, shows its subject retiring in a noble way. It will be advantageous in every respect.","plain":"A cheerful, free retreat. You leave without regret, resentment or entanglement, and everything works out well."}]},{"n":34,"zh":"大壯","pinyin":"Dà Zhuàng","legge":"Tâ Kwang","name":"The Power of the Great","alt":"Great Strength","glyph":"䷡","lower":"qian","upper":"zhen","bits":"111100","keywords":["power","strength","momentum","restraint","integrity"],"core":"a time of great strength and momentum, which succeeds only when power is guided by what is right","now":"Thunder high in heaven: strength in motion. The Power of the Great describes a time when you have energy, confidence and influence. The text says firm correctness is what makes this favourable. Real strength includes self-control. The Image advises not taking any step that is not in accordance with what is proper. Power without restraint can run into walls, like a ram that gets its horns stuck in a fence. Use your strength for what is right and know when not to push.","dir":"The situation may be moving toward greater strength and momentum. The challenge will be to use power wisely and with restraint.","do":["Use your strength for good purposes","Combine power with self-control","Pause before forcing an outcome"],"avoid":["Aggression or bullying","Pushing headlong into obstacles"],"love":"Your strength can be protective and reassuring, but make sure it does not become controlling.","work":"You have influence and momentum. Use it fairly, and do not overreach.","self":"Feel your strength, then choose to direct it carefully.","jung":"The Power of the Great may describe a surge of energy from the unconscious that empowers the ego. The risk is identification with power, an inflation that loses sight of limits.","example":"Getting a big promotion, winning an argument, or feeling unusually energetic and confident.","judgment":"Tâ Kwang indicates that (under the conditions which it symbolises) it will be advantageous to be firm and correct.","image":"(The trigram representing) heaven and above it that for thunder form Tâ Kwang. The superior man, in accordance with this, does not take a step which is not according to propriety.","lines":[{"legge":"The first NINE, undivided, shows its subject manifesting his strength in his toes. But advance will lead to evil,--most certainly.","plain":"Strength in the toes: pushing forward from the very bottom with no real position. Advancing now leads to misfortune. Wait."},{"legge":"The second NINE, undivided, shows that with firm correctness there will be good fortune.","plain":"Firm correctness brings good fortune. Your strength is well balanced; keep it that way."},{"legge":"The third NINE, undivided, shows, in the case of a small man, one using all his strength; and in the case of a superior man, one whose rule is not to do so. Even with firm correctness the position would be perilous. (The exercise of strength in it might be compared to the case of) a ram butting against a fence, and getting his horns entangled.","plain":"A petty person uses force; a superior person does not, knowing it is dangerous. A ram that butts a fence gets its horns caught. Do not force things."},{"legge":"The fourth NINE, undivided, shows (a case in which) firm correctness leads to good fortune, and occasion for repentance disappears. (We see) the fence opened without the horns being entangled. The strength is like that in the wheel-spokes of a large waggon.","plain":"Firm correctness brings good fortune and regret vanishes. The fence opens and the horns are free. Strength is like the axle of a big cart: steady, quiet power that carries you forward."},{"legge":"The fifth SIX, divided, shows one who loses his ram(-like strength) in the ease of his position. (But) there will be no occasion for repentance.","plain":"Losing the ram's stubbornness with ease. Letting go of the urge to force brings no regret."},{"legge":"The sixth SIX, divided, shows (one who may be compared to) the ram butting against the fence, and unable either to retreat, or to advance as he would fain do. There will not be advantage in any respect; but if he realise the difficulty (of his position), there will be good fortune.","plain":"A ram butts the fence and cannot go forward or back. Nothing furthers. Recognizing the difficulty brings good fortune in the end."}]},{"n":35,"zh":"晉","pinyin":"Jìn","legge":"Zin","name":"Progress","alt":"Advancement","glyph":"䷢","lower":"kun","upper":"li","bits":"000101","keywords":["progress","recognition","rising","visibility","advancement"],"core":"a time of rapid, easy progress, like the sun rising over the earth, in which clarity and good conduct bring recognition","now":"The sun rises over the earth. Progress describes a time of steady advancement and recognition. The traditional text pictures a prince honoured with many horses by the king and received three times in a single day. Your efforts are noticed and things move forward. The Image advises the wise person to make their own bright virtue shine. Progress here depends on clarity and on serving something larger than yourself.","dir":"The situation may be moving toward progress and recognition. Clarity and generosity will help you advance.","do":["Let your strengths and good qualities be seen","Serve the people who support you","Keep your motives clear"],"avoid":["Taking credit selfishly","Rushing ahead without trust"],"love":"The relationship can grow openly and joyfully. Share your progress with your partner.","work":"A good time for advancement, visibility and recognition.","self":"Let your best qualities shine. Growth comes naturally when you are clear about who you are.","jung":"Progress, the rising sun, may symbolize expanding consciousness. As awareness grows, the ego can make progress, provided it remains connected to the deeper Self.","example":"Getting a promotion, receiving public recognition, or making steady progress in learning.","judgment":"In Žin we see a prince who secures the tranquillity (of the people) presented on that account with numerous horses (by the king), and three times in a day received at interviews.","image":"(The trigram representing) the earth and that for the bright (sun) coming forth above it form Žin. The superior man, according to this, gives himself to make more brilliant his bright virtue.","lines":[{"legge":"The first SIX, divided, shows one wishing to advance, and (at the same time) kept back. Let him be firm and correct, and there will be good fortune. If trust be not reposed in him, let him maintain a large and generous mind, and there will be no error.","plain":"Progressing, but held back. Stay correct and calm. If others do not yet trust you, stay generous and relaxed; there is no mistake."},{"legge":"The second SIX, divided, shows its subject with the appearance of advancing, and yet of being sorrowful. If he be firm and correct, there will be good fortune. He will receive this great blessing from his grandmother.","plain":"Progressing, but feeling sorrowful. Stay firm. Great blessing will come from a motherly or caring figure."},{"legge":"The third SIX, divided, shows its subject trusted by all (around him). All occasion for repentance will disappear.","plain":"Everyone agrees with you. Support from others makes regret disappear."},{"legge":"The fourth NINE, undivided, shows its subject with the appearance of advancing, but like a marmot. However firm and correct he may be, the position is one of peril.","plain":"Progressing like a squirrel: clinging to position and grasping. This is dangerous even if correct."},{"legge":"The fifth SIX, divided, shows how all occasion for repentance disappears (from its subject). (But) let him not concern himself about whether he shall fail or succeed. To advance will be fortunate, and in every way advantageous.","plain":"Regret disappears. Do not worry about gain or loss; going forward brings good fortune."},{"legge":"The topmost NINE, undivided, shows one advancing his horns. But he only uses them to punish the (rebellious people of his own) city. The position is perilous, but there will be good fortune. (Yet) however firm and correct he may be, there will be occasion for regret.","plain":"Progressing with the horns, using force only to set your own house in order. There is danger, but good fortune and no blame. Continuing this way brings humiliation."}]},{"n":36,"zh":"明夷","pinyin":"Míng Yí","legge":"Ming Î","name":"Darkening of the Light","alt":"Brightness Hidden","glyph":"䷣","lower":"li","upper":"kun","bits":"101000","keywords":["adversity","concealment","integrity","endurance","inner light"],"core":"a dark time in which you protect your inner light by being discreet and keeping your integrity","now":"The sun has sunk beneath the earth. Darkening of the Light describes a time of adversity, when good qualities are not recognized and may even be resented. The text says it is advantageous to be firm and correct in difficulty. Sometimes the wisest course is to hide your light — to stay discreet, protect yourself and keep your integrity quietly, as the Image says, veiling your brightness while still remaining bright within. Darkness does not last forever.","dir":"The situation may be moving toward a difficult or unappreciative environment, where discretion and inner steadiness protect you.","do":["Protect your integrity quietly","Be discreet and do not provoke","Keep your inner light alive"],"avoid":["Openly fighting a hostile environment","Losing hope"],"love":"Be patient through difficult times. Protect what is precious between you.","work":"In a hostile or unfair environment, keep a low profile and protect your reputation.","self":"Hold on to your inner values even when they are not reflected around you.","jung":"Darkening of the Light may describe a time when consciousness is overwhelmed by the shadow, depression or outer difficulties. The task is to keep a spark of awareness alive through the darkness.","example":"Working under an unfair boss, living through a period of depression, or enduring a time of injustice.","judgment":"Ming Î indicates that (in the circumstances which it denotes) it will be advantageous to realise the difficulty (of the position), and maintain firm correctness.","image":"(The trigram representing) the earth and that for the bright (sun) entering within it form Ming Î. The superior man, in accordance with this, conducts his management of men;--he shows his intelligence by keeping it obscured.","lines":[{"legge":"The first NINE, undivided, shows its subject, (in the condition indicated by) Ming Î, flying, but with drooping wings. When the superior man (is revolving) his going away, he may be for three days without eating. Wherever he goes, the people there may speak (derisively of him).","plain":"Darkening of the light while flying: the wings droop. You may have to go without comfort for a while. People may misunderstand you, but persevere."},{"legge":"The second SIX, divided, shows its subject, (in the condition indicated by) Ming Î, wounded in the left thigh. He saves himself by the strength of a (swift) horse; and is fortunate.","plain":"Wounded in the left thigh. Help comes from a strong horse. Use whatever support you can; there is good fortune."},{"legge":"The third NINE, undivided, shows its subject, (in the condition indicated by) Ming Î, hunting in the south, and taking the great chief (of the darkness). He should not be eager to make (all) correct (at once).","plain":"During a hunt in the south, the leader of darkness is captured. Change cannot be rushed, but it is now possible."},{"legge":"The fourth six, divided, shows its subject (just) entered into the left side of the belly (of the dark land). (But) he is able to carry out the mind appropriate (in the condition indicated by) Ming Î, quitting the gate and courtyard (of the lord of darkness).","plain":"Entering the left side of the belly, understanding the heart of the darkening, and then leaving through the gate. Knowing the true situation, you withdraw."},{"legge":"The fifth six, divided, shows how the count of Kî fulfilled the condition indicated by Ming Î. It will be advantageous to be firm and correct.","plain":"Prince Ji's darkening of the light: he hid his wisdom to survive under a tyrant. Firmness furthers."},{"legge":"The sixth six, divided, shows the case where there is no light, but (only) obscurity. (Its subject) had at first ascended to (the top of) the sky; his future shall be to go into the earth.","plain":"Not light but darkness. First it climbs to heaven, then it plunges into the earth. Darkness destroys itself."}]},{"n":37,"zh":"家人","pinyin":"Jiā Rén","legge":"Kia Zăn","name":"The Family","alt":"The Clan","glyph":"䷤","lower":"li","upper":"xun","bits":"101011","keywords":["family","roles","home","responsibility","loyalty"],"core":"a time to strengthen close relationships and the home, where clear roles and sincere words create order","now":"Wind comes forth from fire: influence spreads outward from the hearth. The Family describes the inner circle of life — home, family, close relationships — and the clear roles and mutual respect that make it work. The text says it is advantageous for the woman of the household to be firm and correct. In modern terms, the hexagram emphasizes responsibility, consistency and sincere words that are backed by actions. When the family is in order, the wider world is set in order too.","dir":"The situation may be moving toward a focus on home, family and close relationships, where clear roles and loving discipline are needed.","do":["Make your words match your actions","Clarify roles and responsibilities","Show warmth and loyalty"],"avoid":["Inconsistency","Harshness or neglect at home"],"love":"Commitment and shared responsibilities strengthen the relationship. Be reliable.","work":"Treat the team like a family: clear roles, mutual respect and consistency.","self":"Look at the patterns you learned at home. Which ones support you?","jung":"The Family may point to the family complexes that shape the personality. It invites reflection on the roles and patterns inherited from parents and their effects on present relationships.","example":"Setting new household routines, resolving family tensions, or building trust in a small team.","judgment":"For (the realisation of what is taught in) Kiâ Zăn, (or for the regulation of the family), what is most advantageous is that the wife be firm and correct.","image":"(The trigram representing) fire, and that for wind coming forth from it, form Kiâ Zăn. The superior man, in accordance with this, orders his words according to (the truth of) things, and his conduct so that it is uniformly consistent.","lines":[{"legge":"The first NINE, undivided, shows its subject establishing restrictive regulations in his household Occasion for repentance will disappear.","plain":"Firm boundaries within the family. Clear rules from the start prevent later regret."},{"legge":"The second SIX, divided, shows its subject taking nothing on herself, but in her central place attending to the preparation of the food. Through her firm correctness there will be good fortune.","plain":"She does not follow her whims, but attends to the household. Steady care brings good fortune."},{"legge":"The third NINE, undivided, shows its subject (treating) the members of the household with stern severity. There will be occasion for repentance, there will be peril, (but) there will (also) be good fortune. If the wife and children were to be smirking and chattering, in the end there would be occasion for regret.","plain":"When family members are treated too harshly, there is regret, but still good fortune; when they giggle and jest without restraint, humiliation follows. Strictness is better than indulgence."},{"legge":"The fourth SIX, divided, shows its subject enriching the family. There will be great good fortune.","plain":"She is the treasure of the house. Great good fortune."},{"legge":"The fifth NINE, undivided, shows the influence of the king extending to his family. There need be no anxiety; there will be good fortune.","plain":"As a king approaches his family, there is no fear. Good fortune. Lead with love."},{"legge":"The topmost NINE, undivided, shows its subject possessed of sincerity and arrayed in majesty. In the end there will be good fortune.","plain":"Sincerity and dignity bring good fortune in the end."}]},{"n":38,"zh":"睽","pinyin":"Kuí","legge":"Khwei","name":"Opposition","alt":"Estrangement","glyph":"䷥","lower":"dui","upper":"li","bits":"110101","keywords":["opposition","difference","misunderstanding","reconciliation","small steps"],"core":"a time of opposition and misunderstanding, when small steps toward understanding can still succeed","now":"Fire above, lake below: fire rises and water sinks, moving in opposite directions. Opposition describes estrangement, misunderstanding or different perspectives. The text says that in small matters there is good fortune. Large, joint undertakings may not work now, but small acts of understanding can. Respect differences. The Image advises the wise person to recognize what he has in common with others while keeping what makes him distinct.","dir":"The situation may be moving toward differences or misunderstandings. Small steps toward understanding will be more effective than big gestures.","do":["Respect differences","Look for small points of agreement","Clarify misunderstandings patiently"],"avoid":["Forcing agreement","Treating differences as enmity"],"love":"You may see things differently. Small gestures of understanding can bridge the gap.","work":"Not everyone will agree. Achieve small wins and avoid big, risky collaborations now.","self":"Accept that you have conflicting feelings or that others see you differently.","jung":"Opposition may describe the polarity of opposites within the psyche. The tension of opposites can lead to new understanding when it is held consciously rather than resolved too quickly.","example":"A disagreement with a partner, different views within a team, or a family member who sees things very differently.","judgment":"Khwei indicates that, (notwithstanding the condition of things which it denotes), in small matters there will (still) be good success.","image":"(The trigram representing) fire above, and that for (the waters of) a marsh below, form Khwei. The superior man, in accordance with this, where there is a general agreement, yet admits diversity.","lines":[{"legge":"The first NINE, undivided, shows that (to its subject) occasion for repentance will disappear. He has lost his horses, but let him not seek for them;--they will return of themselves. Should he meet with bad men, he will not err (in communicating with them).","plain":"Regret disappears. If you lose your horse, do not run after it; it will return by itself. When you meet unpleasant people, be courteous."},{"legge":"The second NINE, undivided, shows its subject happening to meet with his lord in a bye-passage. There will be no error.","plain":"Meeting your lord in a narrow street. An unexpected encounter can resolve a misunderstanding. No blame."},{"legge":"In the third SIX, divided, we see one whose carriage is dragged back, while the oxen in it are pushed back, and he is himself subjected to the shaving of his head and the cutting off of his nose. There is no good beginning, but there will be a good end.","plain":"The cart is dragged back, the oxen halted, the man's hair and nose cut off. A bad beginning, but a good end."},{"legge":"The fourth NINE, undivided, shows its subject solitary amidst the (prevailing) disunion. (But) he meets with the good man (represented by the first line), and they blend their sincere desires together. The position is one of peril, but there will be no mistake.","plain":"Isolated through opposition, you meet a like-minded person and trust each other. Danger, but no blame."},{"legge":"The fifth SIX, divided, shows that (to its subject) occasion for repentance will disappear. With his relative (and minister he unites closely and readily) as if he were biting through a piece of skin. When he goes forward (with this help), what error can there be?","plain":"Regret disappears. Your companion bites through the wrapping. Going forward together brings no blame."},{"legge":"The topmost NINE, undivided, shows its subject solitary amidst the (prevailing) disunion. (In the subject of the third line, he seems to) see a pig bearing on its back a load of mud, (or fancies) there is a carriage full of ghosts. He first bends his bow against him, and afterwards unbends it, (for he discovers) that he is not an assailant to injure, but a near relative. Going forward, he shall meet with (genial) rain, and there will be good fortune.","plain":"Isolated through opposition, you see a pig covered with mud, a cart full of devils. You draw your bow, then put it down. It is not a robber but a suitor. Misunderstandings dissolve, like rain clearing the air."}]},{"n":39,"zh":"蹇","pinyin":"Jiǎn","legge":"Kien","name":"Obstruction","alt":"Difficulty","glyph":"䷦","lower":"gen","upper":"kan","bits":"001010","keywords":["obstacles","reflection","help","self-improvement","patience"],"core":"a time of obstruction, when the wise response is to pause, reflect, seek help and improve yourself","now":"Water on the mountain: danger ahead and a steep slope behind. Obstruction describes a situation where the way forward is blocked. The traditional text says that the southwest (the direction of easy, open country) is favourable and the northeast (steep mountains) is not, and that it furthers you to see the great man. In plain terms, do not keep charging at the obstacle. Step back, seek help, and use the obstacle as a reason to examine and improve yourself.","dir":"The situation may be moving toward obstacles. Pausing, seeking help and improving yourself will be more effective than forcing your way.","do":["Pause and reassess","Seek help from experienced people","Use the obstacle to improve yourself"],"avoid":["Pushing blindly against the obstacle","Blaming others for the blockage"],"love":"If you feel blocked, look at your own role first. Ask for help or counselling if needed.","work":"A project may hit obstacles. Regroup, seek advice and change your approach.","self":"The obstacle may be teaching you something. Turn inward and ask what.","jung":"Obstruction may symbolize an inner obstacle — a complex or resistance that blocks psychological growth. Rather than fighting it, one can turn inward to understand it.","example":"A delayed project, a stalled career, or a personal problem that does not seem to move.","judgment":"In (the state indicated by) Kien advantage will be found in the south-west, and the contrary in the north-east. It will be advantageous (also) to meet with the great man. (In these circumstances), with firmness and correctness, there will be good fortune.","image":"(The trigram representing) a mountain, and above it that for water, form Kien. The superior man, in accordance with this, turns round (and examines) himself, and cultivates his virtue.","lines":[{"legge":"From the first SIX, divided, we learn that advance (on the part of its subject) will lead to (greater) difficulties, while remaining stationary will afford ground for praise.","plain":"Going forward leads into difficulty; holding back earns praise. Wait for a better moment rather than pushing into the obstacle."},{"legge":"The second SIX, divided, shows the minister of the king struggling with difficulty on difficulty, and not with a view to his own advantage.","plain":"Like a loyal servant of the king, you meet difficulty upon difficulty, and not through any fault or selfish aim of your own. Keep working for the greater good; you are not to blame."},{"legge":"The third NINE, undivided, shows its subject advancing, (but only) to (greater) difficulties. He remains stationary, and returns (to his former associates).","plain":"Going forward would only make the obstacle worse, so you turn back to the people who rely on you. Returning to your own circle is right for now."},{"legge":"The fourth SIX, divided, shows its subject advancing, (but only) to (greater) difficulties. He remains stationary, and unites (with the subject of the line above).","plain":"Going forward leads to difficulty; staying back lets you join forces with others. Build alliances before you try again."},{"legge":"The fifth NINE, undivided, shows its subject struggling with the greatest difficulties, while friends are coming to help him.","plain":"In the middle of the greatest difficulty, friends arrive to help. When you hold to your purpose, support comes when it is most needed."},{"legge":"The topmost SIX, divided, shows its subject going forward, (only to increase) the difficulties, while his remaining stationary will be (productive of) great (merit). There will be good fortune, and it will be advantageous to meet with the great man.","plain":"Pressing on would only add to the trouble; staying and working with others brings great achievement and good fortune. Seek out a wise and capable person."}]},{"n":40,"zh":"解","pinyin":"Xiè","legge":"Kieh","name":"Deliverance","alt":"Release","glyph":"䷧","lower":"kan","upper":"zhen","bits":"010100","keywords":["release","relief","forgiveness","resolution","new beginning"],"core":"a time of release after tension, when problems can be resolved quickly and old grievances forgiven","now":"Thunder and rain: the storm breaks and the air clears. Deliverance describes the release of tension after a difficult period. The text says the southwest is favourable, and that where nothing more needs to be done, returning to normal brings good fortune; where something still needs doing, acting quickly brings good fortune. The Image advises the wise person to forgive mistakes and pardon misdeeds. Let go of what is over, finish what is necessary and return to normal life.","dir":"The situation may be moving toward release and relief. Resolve what remains quickly, forgive and return to ordinary life.","do":["Resolve remaining issues quickly","Forgive and let go","Return to normal routines"],"avoid":["Lingering in old conflicts","Holding grudges"],"love":"Clear the air and forgive. A fresh start is possible.","work":"Tie up loose ends quickly and move on. Do not dwell on past mistakes.","self":"Release tension, rest and let go of what is over.","jung":"Deliverance may describe the release of psychic tension after a complex has been made conscious. The energy bound up in conflict becomes free for life again.","example":"The end of an exam period, resolving a dispute, or recovering after a crisis.","judgment":"In (the state indicated by) Kieh advantage will be found in the south-west. If no (further) operations be called for, there will be good fortune in coming back (to the old conditions). If some operations be called for, there will be good fortune in the early conducting of them.","image":"(The trigram representing) thunder and that for rain, with these phenomena in a state of manifestation, form Kieh. The superior man, in accordance with this, forgives errors, and deals gently with crimes.","lines":[{"legge":"The first SIX, divided, shows that its subject will commit no error.","plain":"The tension has eased and the problem is resolved. Rest quietly; there is no blame."},{"legge":"The second NINE, undivided, shows its subject catch, in hunting, three foxes, and obtain the yellow (= golden) arrows. With firm correctness there will be good fortune.","plain":"Catching three foxes in the field and gaining a yellow arrow. You remove sly, deceptive influences while staying straight and balanced yourself. Good fortune."},{"legge":"The third SIX, divided, shows a porter with his burden, (yet) riding in a carriage. He will (only) tempt robbers to attack him. However firm and correct he may (try to) be, there will be cause for regret.","plain":"A porter carrying a load while riding in a fine carriage invites robbers. Claiming a position you have not earned attracts trouble. Be honest about where you stand."},{"legge":"(To the subject of) the fourth NINE, undivided, (it is said), 'Remove your toes. Friends will (then) come, between you and whom there will be mutual confidence.'","plain":"Free yourself from a dependent or unworthy connection, as one shakes off something clinging to the toe. Then a true friend can come, and trust grows between you."},{"legge":"The fifth SIX, divided, shows (its subject), the superior man (= the ruler), executing his function of removing (whatever is injurious to the idea of the hexagram), in which case there will he good fortune, and confidence in him will be shown even by the small men.","plain":"Only a person of real character can bring this release by removing what is harmful. Good fortune; even skeptical or petty people are convinced by the result."},{"legge":"In the sixth SIX, divided, we see a feudal prince (with his bow) shooting at a falcon on the top of a high wall, and hitting it. (The effect of his action) will be in every way advantageous.","plain":"A prince shoots at a hawk perched on a high wall and brings it down. Removing the last, well-placed obstacle frees everything. All is favourable."}]},{"n":41,"zh":"損","pinyin":"Sǔn","legge":"Sun","name":"Decrease","alt":"Reduction","glyph":"䷨","lower":"dui","upper":"gen","bits":"110001","keywords":["decrease","simplicity","sacrifice","restraint","sincerity"],"core":"a time of decrease, when reducing excess, simplifying and giving sincerely can strengthen what matters most","now":"A lake at the foot of a mountain: the lake gives up water to the mountain, which becomes greener. Decrease describes a time when something must be reduced, given up or simplified. The text says that if decrease is combined with sincerity, it brings great good fortune, and that even two small bowls are enough for a sacrifice. Less can be more. Cutting back on excess, controlling anger and desire, and giving to what deserves support can strengthen what is essential.","dir":"The situation may be moving toward a period of reduction or simplification. Sincerity and wise sacrifice will make it fruitful.","do":["Simplify and reduce excess","Give sincerely where it helps","Control anger and impulses"],"avoid":["Resentment about loss","Reducing what is essential"],"love":"Let go of unnecessary demands or expectations. Simple sincerity is enough.","work":"Cut costs or simplify processes. Focus resources where they matter most.","self":"Practise restraint and simplicity. Ask what you can let go of.","jung":"Decrease may describe the reduction of ego-demands so that something deeper can grow. Sacrificing a one-sided attitude can make space for the Self.","example":"Reducing spending, decluttering, cutting back on commitments, or giving time to others.","judgment":"In (what is denoted by) Sun, if there be sincerity (in him who employs it), there will be great good fortune:--freedom from error; firmness and correctness that can be maintained; and advantage in every movement that shall be made. In what shall this (sincerity in the exercise of Sun) be employed? (Even) in sacrifice two baskets of grain, (though there be nothing else), may be presented.","image":"(The trigram representing) a mountain and beneath it that for the waters of a marsh form Sun. The superior man, in accordance with this, restrains his wrath and represses his desires.","lines":[{"legge":"The first NINE, undivided, shows its subject suspending his own affairs, and hurrying away (to help the subject of the fourth line). He will commit no error, but let him consider how far he should contribute of what is his (for the other).","plain":"When your own work is done, hurry to help others. That is right, but think carefully about how much you can give without depleting yourself."},{"legge":"The second NINE, undivided, shows that it will be advantageous for its subject to maintain a firm correctness, and that action on his part will be evil. He can give increase (to his correlate) without taking from himself","plain":"Hold steady and correct; rushing into action now would bring misfortune. Sometimes you help others most by not diminishing yourself."},{"legge":"The third SIX, divided, shows how of three men walking together, the number is diminished by one; and how one, walking, finds his friend.","plain":"When three travel together, one is lost; when one travels alone, he finds a companion. Groups of three tend to split; real closeness forms in pairs."},{"legge":"The fourth SIX, divided, shows its subject diminishing the ailment under which he labours by making (the subject of the first line) hasten (to his help), and make him glad. There will be no error.","plain":"Reducing your own faults makes others come to you gladly. Letting go of what weighs on you brings joy and no blame."},{"legge":"The fifth SIX, divided, shows parties adding to (the stores of) its subject ten pairs of tortoise shells, and accepting no refusal. There will be great good fortune.","plain":"Someone adds to your fortune with a gift of great value that cannot be refused, like ten pairs of precious tortoise shells. Great good fortune comes without being sought."},{"legge":"The topmost NINE, undivided, shows its subject giving increase to others without taking from himself. There will be no error. With firm correctness there will be good fortune. There will be advantage in every movement that shall be made. He will find ministers more than can be counted by their clans.","plain":"You increase others without taking anything from yourself. No blame; staying firm brings good fortune, and people gather to help in a cause that serves everyone."}]},{"n":42,"zh":"益","pinyin":"Yì","legge":"Yî","name":"Increase","alt":"Gain","glyph":"䷩","lower":"zhen","upper":"xun","bits":"100011","keywords":["increase","benefit","generosity","growth","opportunity"],"core":"a time of increase and opportunity, when generosity from above enriches those below and bold action is favoured","now":"Wind and thunder strengthen each other. Increase describes a time of growth and benefit, when what is above gives to what is below. The text says it furthers you to undertake something and to cross the great water — this is a time for bold action. The Image advises the wise person to imitate the good when they see it and correct their faults when they have them. Use this time of growth for real improvement and shared benefit.","dir":"The situation may be moving toward growth and opportunity. Generosity and bold, beneficial action will be supported.","do":["Take advantage of opportunities","Share benefits generously","Improve yourself by learning from good examples"],"avoid":["Selfish use of gains","Missing the moment through hesitation"],"love":"Give generously and support each other's growth.","work":"A good time to expand, invest and take on ambitious projects.","self":"Grow by imitating good examples and correcting faults.","jung":"Increase may describe a flow of energy from the unconscious that enriches consciousness — new insights, creativity and vitality.","example":"Getting resources for a project, receiving help from a mentor, or seeing a business grow.","judgment":"Yî indicates that (in the state which it denotes) there will be advantage in every movement which shall be undertaken, that it will be advantageous (even) to cross the great stream.","image":"(The trigram representing) wind and that for thunder form Yî. The superior man, in accordance with this, when he sees what is good, moves towards it; and when he sees his errors, he turns from them.","lines":[{"legge":"The first NINE, undivided, shows that it will be advantageous for its subject in his position to make a great movement. If it be greatly fortunate, no blame will be imputed to him.","plain":"You are supported to undertake something significant. Use this help for a great, worthwhile effort; then there will be great good fortune and no blame."},{"legge":"The second SIX, divided, shows parties adding to the stores of its subject ten pairs of tortoise shells whose oracles cannot be opposed. Let him persevere in being firm and correct, and there will be good fortune. Let the king, (having the virtues thus distinguished), employ them in presenting his offerings to God, and there will be good fortune.","plain":"Someone adds to your fortune with a valuable gift you cannot refuse. Stay constant and sincere, and keep your gains in service of something higher. Good fortune."},{"legge":"The third SIX, divided, shows increase given to its subject by means of what is evil, so that he shall (be led to good), and be without blame. Let him be sincere and pursue the path of the Mean, (so shall he secure the recognition of the ruler, like) an officer who announces himself to his prince by the symbol of his rank.","plain":"Increase comes even through misfortune, which becomes a test that strengthens you. Stay sincere, keep to the middle path and report honestly to those above you; then there is no blame."},{"legge":"The fourth SIX, divided, shows its subject pursuing the due course. His advice to his prince is followed. He can with advantage be relied on in such a movement as that of removing the capital.","plain":"Walking the middle path, you advise those in authority and they follow. You can be trusted with large changes, even something as big as moving a capital."},{"legge":"The fifth NINE, undivided, shows its subject with sincere heart seeking to benefit (all below). There need be no question about it; the result will be great good fortune. (All below) will with sincere heart acknowledge his goodness.","plain":"A sincere, kind heart that seeks to benefit others has no need to ask whether it is right. Great good fortune; people recognize your goodness."},{"legge":"In the sixth NINE, undivided, we see one to whose increase none will contribute, while many will seek to assail him. He observes no regular rule in the ordering of his heart. There will be evil.","plain":"Taking from others instead of giving, without any steady principle. People stop supporting you and may even attack. This brings misfortune."}]},{"n":43,"zh":"夬","pinyin":"Guài","legge":"Kwai","name":"Breakthrough","alt":"Resoluteness","glyph":"䷪","lower":"qian","upper":"dui","bits":"111110","keywords":["decision","breakthrough","truth","courage","resolution"],"core":"a time to make a decisive breakthrough by openly naming what is wrong, without resorting to violence or force","now":"The lake has risen to heaven: tension builds until it breaks through. Breakthrough describes a time when something must be resolved decisively. The text says you must announce the matter openly at the king's court and be truthful, aware of the danger involved. It does not favour taking up arms. Problems should be confronted openly and honestly, without aggression. Courage and clarity, not force, bring the breakthrough.","dir":"The situation may be moving toward a decisive breakthrough. Openness, honesty and courage will be needed.","do":["Name the problem openly and honestly","Act decisively but without violence","Prepare for some resistance"],"avoid":["Aggression","Hiding the truth"],"love":"Speak openly about what needs to change. Honesty can break through a stalemate.","work":"Make the decision that has been delayed. Communicate it clearly.","self":"Face the truth about a situation you have avoided.","jung":"Breakthrough may describe the moment when a long-repressed insight bursts into consciousness. The ego must face it openly rather than suppress it again.","example":"Calling out unethical behaviour, ending an unhealthy situation, or making a decision you have long postponed.","judgment":"Kwâi requires (in him who would fulfil its meaning) the exhibition (of the culprit's guilt) in the royal court, and a sincere and earnest appeal (for sympathy and support), with a consciousness of the peril (involved in cutting off the criminal). He should (also) make announcement in his own city, and show that it will not be well to have recourse at once to arms. (In this way) there will be advantage in whatever he shall go forward to.","image":"(The trigram representing) heaven and that for the waters of a marsh mounting above it form Kwâi. The superior man, in accordance with this, bestows emolument on those below him, and dislikes allowing his gifts to accumulate (undispensed).","lines":[{"legge":"The first NINE, undivided, shows its subject in (the pride of) strength advancing with his toes. He goes forward, but will not succeed. There will be ground for blame.","plain":"Striding forward full of pride in your strength, you are not equal to the task. Overconfidence at the start leads to mistakes."},{"legge":"The second NINE, undivided, shows its subject full of apprehension and appealing (for sympathy and help). Late at night hostile measures may be (taken against him), but he need not be anxious about them.","plain":"Calling out a warning and staying alert. Even if there is danger at night, you need not fear because you are prepared."},{"legge":"The third NINE, undivided, shows its subject (about to advance) with strong (and determined) looks. There will be evil. (But) the superior man, bent on cutting off (the criminal), will walk alone and encounter the rain, (till he be hated by his proper associates) as if he were contaminated (by the others). (In the end) there will be no blame against him.","plain":"Showing determination in your face invites trouble. The wise person stays resolved, walks alone through the rain, gets soaked and is misunderstood, but is not to blame."},{"legge":"The fourth NINE, undivided, shows one from whose buttocks the skin has been stripped, and who walks slowly and with difficulty. (If he could act) like. a sheep led (after its companions), occasion for repentance would disappear. But though he hear these words, he will not believe them.","plain":"Like someone who cannot sit or walk comfortably, you are restless. If you allowed yourself to be guided, regret would disappear, but you will not listen to advice."},{"legge":"The fifth NINE, undivided, shows (the small men like) a bed of purslain, which ought to be uprooted with the utmost determination. (The subject of the line having such determination), his action, in harmony with his central position, will lead to no error or blame.","plain":"Weeds must be pulled out firmly, roots and all. Deal decisively with the problem while staying balanced in your conduct. No blame."},{"legge":"The sixth SIX, divided, shows its subject without any (helpers) on whom to call. His end will be evil.","plain":"No one to call for help. A problem that is not fully resolved returns. In the end, misfortune follows."}]},{"n":44,"zh":"姤","pinyin":"Gòu","legge":"Kâu","name":"Coming to Meet","alt":"Temptation","glyph":"䷫","lower":"xun","upper":"qian","bits":"011111","keywords":["temptation","encounter","influence","caution","small beginnings"],"core":"an unexpected encounter or influence, which can be welcomed briefly but should not be allowed to take control","now":"Wind under heaven: something blows in from outside. Coming to Meet describes an unexpected encounter — a new person, opportunity or influence. The text pictures a bold woman and advises not to marry such a woman: do not give a strong, unbalanced influence too much power. A small influence that seems harmless can grow strong if you are not careful. Meet new things openly, but with discernment.","dir":"The situation may be moving toward an unexpected encounter or influence. Meet it with openness, but stay discerning.","do":["Be open to new encounters","Use good judgment about influences","Set limits early"],"avoid":["Letting a small influence take control","Naive trust"],"love":"An attractive new connection may come. Enjoy it, but do not rush into commitment.","work":"New opportunities appear. Evaluate them carefully before you commit.","self":"Notice a temptation or habit that seems small but might grow.","jung":"Coming to Meet may describe an unexpected encounter with a part of the unconscious — often the anima or animus — that is fascinating but potentially overwhelming. It needs to be integrated, not obeyed.","example":"A charming new acquaintance, a tempting offer, or a habit that starts small.","judgment":"Kâu shows a female who is bold and strong. It will not be good to marry (such) a female.","image":"(The trigram representing) wind and that for the sky above it form Kâu. The sovereign, in accordance with this, delivers his charges, and promulgates his announcements throughout the four quarters (of the kingdom).","lines":[{"legge":"The first SIX, divided, shows how its subject should be kept (like a carriage) tied and fastened to a metal drag, in which case with firm correctness there will be good fortune. (But) if he move in any direction, evil will appear. He will be (like) a lean pig, which is sure to keep jumping about.","plain":"Stop it with a bronze brake. A small but dangerous influence should be checked firmly at the start; if it is allowed to run loose, like a restless pig, it brings trouble."},{"legge":"The second NINE, undivided, shows its subject with a wallet of fish. There will be no error. But it will not be well to let (the subject of the first line) go forward to the guests.","plain":"There is a fish in the basket. Keep this influence contained and under your care. Do not pass it on to others. No blame."},{"legge":"The third NINE, undivided, shows one from whose buttocks the skin has been stripped so that he walks with difficulty. The position is perilous, but there will be no great error.","plain":"Like someone who cannot sit or walk comfortably, you feel uneasy and indecisive. There is danger, but no great mistake if you stay aware."},{"legge":"The fourth NINE, undivided, shows its subject with his wallet, but no fish in it. This will give rise to evil.","plain":"The basket is empty; there is no fish. By keeping your distance from ordinary people, you lose their support. This leads to misfortune."},{"legge":"The fifth NINE, undivided, (shows its subject as) a medlar tree overspreading the gourd (beneath it). If he keep his brilliant qualities concealed, (a good issue) will descend (as) from Heaven.","plain":"A melon sheltered under the leaves of a willow. Keep your good qualities modest and hidden, and success will come as if from heaven."},{"legge":"The sixth NINE, undivided, shows its subject receiving others on his horns. There will be occasion for regret, but there will be no error.","plain":"Meeting others with your horns. Being too aloof and confrontational brings regret, but no great blame."}]},{"n":45,"zh":"萃","pinyin":"Cuì","legge":"Zhui","name":"Gathering Together","alt":"Assembly","glyph":"䷬","lower":"kun","upper":"dui","bits":"000110","keywords":["gathering","community","shared purpose","preparation","leadership"],"core":"a time of gathering together around a common center, which needs leadership, sincerity and preparation","now":"The lake over the earth: waters gather. Gathering Together describes the assembling of people around a common purpose. The text mentions the king approaching his temple, seeing the great man, and making great offerings. Gathering works best around a strong, sincere center. The Image warns that when many people gather, conflict can also arise, so prepare and stay alert.","dir":"The situation may be moving toward a time of gathering and community. Leadership, shared purpose and preparation will be important.","do":["Gather people around a shared purpose","Be sincere and generous","Prepare for unexpected problems"],"avoid":["Gathering without purpose","Neglecting security or planning"],"love":"Family gatherings or shared commitments may strengthen your bond.","work":"Bring people together for a common goal. Plan well and lead clearly.","self":"Gather your inner resources and focus on what really matters.","jung":"Gathering Together may describe the integration of scattered psychic contents around a central focus — the Self.","example":"Organizing a reunion, starting a community group, or bringing a team together for a project.","judgment":"In (the state denoted by) Žhui, the king will repair to his ancestral temple. It will be advantageous (also) to meet with the great man; and then there will be progress and success, though the advantage must come through firm correctness. The use of great victims will conduce to good fortune; and in whatever direction movement is made, it will be advantageous.","image":"(The trigram representing the) earth and that for the waters of a marsh raised above it form Žhui. The superior man, in accordance with this, has his weapons of war put in good repair, to be prepared against unforeseen contingencies.","lines":[{"legge":"The first SIX, divided, shows its subject with a sincere desire (for union), but unable to carry it out, so that disorder is brought into the sphere of his union. If he cry out (for help to his proper correlate), all at once (his tears) will give place to smiles. He need not mind (the temporary difficulty); as he goes forward, there will be no error.","plain":"You sincerely want to join with others, but cannot carry it through, which causes confusion. If you call out for help, tears turn into smiles. Do not worry; go ahead."},{"legge":"The second SIX, divided, shows its subject led forward (by his correlate). There will be good fortune, and freedom from error. There is entire sincerity, and in that case (even the small offerings of) the vernal sacrifice are acceptable.","plain":"Being drawn into the gathering by the right person brings good fortune. With sincerity, even a small offering is acceptable."},{"legge":"The third SIX, divided, shows its subject striving after union and seeming to sigh, yet nowhere finding any advantage. If he go forward, he will not err, though there may be some small cause for regret.","plain":"Wanting to belong, but sighing because nothing works out. Going forward is still not a mistake, even if there is some small regret."},{"legge":"The fourth NINE, undivided, shows its subject in such a state that, if he be greatly fortunate, he will receive no blame.","plain":"Great good fortune is needed for this position to be without blame. Make sure your role in the group is earned and serves everyone."},{"legge":"The fifth NINE, undivided, shows the union (of all) under its subject in the place of dignity. There will be no error. If any do not have confidence in him, let him see to it that (his virtue) be great, long-continued, and firmly correct, and all occasion for repentance will disappear.","plain":"You are at the center of the gathering. If some do not yet trust you, keep developing lasting, firm integrity, and regret will disappear."},{"legge":"The topmost SIX, divided, shows its subject sighing and weeping; but there will be no error.","plain":"Sighing and weeping because union has not been achieved. Sincere sorrow about this is not a mistake; it can open the way to reconciliation."}]},{"n":46,"zh":"升","pinyin":"Shēng","legge":"Shăng","name":"Pushing Upward","alt":"Ascending","glyph":"䷭","lower":"xun","upper":"kun","bits":"011000","keywords":["growth","effort","gradual progress","ambition","seeking help"],"core":"a time of steady upward growth, like a plant pushing through the earth, achieved through patient effort","now":"Wood grows within the earth: a plant pushes steadily upward. Pushing Upward describes gradual, steady progress. The text says that seeking the great man brings success, that you need not fear, and that it is good to depart toward the south. Growth now is not sudden; it comes from patient effort and adaptation, like a plant bending around obstacles. Keep going, step by step.","dir":"The situation may be moving toward steady growth and gradual progress. Patient effort and good guidance will help you rise.","do":["Make steady progress step by step","Seek guidance from those who can help","Stay adaptable and modest"],"avoid":["Impatience","Trying to rise too fast"],"love":"The relationship can grow gradually and steadily. Invest in it consistently.","work":"Promotion or progress is possible through steady effort and good relationships with superiors.","self":"Personal growth happens step by step. Celebrate small advances.","jung":"Pushing Upward may describe the growth of consciousness from unconscious roots — gradual, organic and persistent.","example":"Working your way up in a career, slowly improving a skill, or steadily recovering from illness.","judgment":"Shăng indicates that (under its conditions) there will be great progress and success. Seeking by (the qualities implied in it) to meet with the great man, its subject need have no anxiety. Advance to the south will be fortunate.","image":"(The trigram representing) wood and that for the earth with the wood growing in the midst of it form Shăng. The superior man, in accordance with this, pays careful attention to his virtue, and accumulates the small developments of it till it is high and great.","lines":[{"legge":"The first SIX, divided, shows its subject advancing upwards with the welcome (of those above him). There will be great good fortune.","plain":"Rising with the welcome and trust of those above you. Great good fortune."},{"legge":"The second NINE, undivided, shows its subject with that sincerity which will make even the (small) offerings of the vernal sacrifice acceptable. There will be no error.","plain":"When you are sincere, even a small offering is acceptable. Genuine intention matters more than outward show. No blame."},{"legge":"The third NINE, undivided, shows its subject ascending upwards (as into) an empty city.","plain":"Rising as if into an empty city. Nothing stands in your way now; go forward without hesitation."},{"legge":"The fourth SIX, divided, shows its subject employed by the king to present his offerings on mount Khî. There will be good fortune; there will be no mistake.","plain":"Being honoured with a role on the sacred mountain. Faithful service is recognized. Good fortune and no blame."},{"legge":"The fifth six, divided, shows its subject firmly correct, and therefore enjoying good fortune. He ascends the stairs (with all due ceremony).","plain":"Firmness brings good fortune. Rise step by step, as one climbs stairs with dignity, rather than leaping ahead."},{"legge":"The sixth six, divided, shows its subject advancing upwards blindly. Advantage will be found in a ceaseless maintenance of firm correctness.","plain":"Rising in the dark, without seeing where you are going. Continue only with steady, unceasing correctness; blind ambition is dangerous."}]},{"n":47,"zh":"困","pinyin":"Kùn","legge":"Khwăn","name":"Oppression","alt":"Exhaustion","glyph":"䷮","lower":"kan","upper":"dui","bits":"010110","keywords":["hardship","exhaustion","constraint","endurance","inner strength"],"core":"a time of hardship and exhaustion, when outer resources fail and inner integrity is what carries you through","now":"A lake without water: it has drained away. Oppression describes a time of hardship, exhaustion or confinement. The text says it can still bring success to the great person who remains firm, and that words are not believed. Outer circumstances may be harsh, and explaining yourself may not help. What matters is inner integrity. The Image advises the superior person to stake their life on carrying out their will.","dir":"The situation may be moving toward difficulty or exhaustion. Inner strength and integrity will matter more than words or outer resources.","do":["Hold on to your inner strength and values","Conserve energy","Let actions speak instead of words"],"avoid":["Complaining or excessive explaining","Losing faith in yourself"],"love":"Difficult times can test a relationship. Stay steady and supportive without long arguments.","work":"Resources may be scarce. Focus on what you can control and do not overpromise.","self":"You may feel drained. Rest and remember what you stand for.","jung":"Oppression may describe a state of psychic exhaustion when the conscious attitude has run dry. It can force a turn inward toward deeper sources of meaning.","example":"Feeling burnt out at work, financial difficulties, or a period of loneliness.","judgment":"In (the condition denoted by) Khwăn there may (yet be) progress and success. For the firm and correct, the (really) great man, there will be good fortune. He will fall into no error. If he make speeches, his words cannot be made good.","image":"(The trigram representing) a marsh, and (below it that for a defile, which has drained the other dry so that there is) no water in it, form Khwăn. The superior man, in accordance with this, will sacrifice his life in order to carry out his purpose.","lines":[{"legge":"The first SIX, divided, shows its subject with bare buttocks straitened under the stump of a tree. He enters a dark valley, and for three years has no prospect (of deliverance).","plain":"Sitting oppressed under a bare tree, wandering into a gloomy valley. You may see no way out for a long time. Do not sink deeper into despair; the darkness is not permanent."},{"legge":"The second NINE, undivided, shows its subject straitened amidst his wine and viands. There come to him anon the red knee-covers (of the ruler). It will be well for him (to maintain his sincerity as) in sacrificing. Active operations (on his part) will lead to evil, but he will be free from blame.","plain":"Oppressed even amid food and drink: comfort without fulfilment. Help from a person of rank is coming. Stay sincere as in a sacred rite; acting rashly now would bring trouble, though not blame."},{"legge":"The third SIX, divided, shows its subject straitened before a (frowning) rock. He lays hold of thorns. He enters his palace, and does not see his wife. There will be evil.","plain":"Struggling against stone and grasping at thorns, returning home to find no one there. Fighting the wrong battles and leaning on what hurts you leads to misfortune."},{"legge":"The fourth NINE, undivided shows its subject proceeding very slowly (to help the subject of the first line), who is straitened by the carriage adorned with metal in front of him. There will be occasion for regret, but the end will be good.","plain":"Help comes slowly because it is blocked by obstacles that look impressive. There is embarrassment, but things come right in the end."},{"legge":"The fifth NINE, undivided, shows its subject with his nose and feet cut off. He is straitened by (his ministers in their) scarlet aprons. He is leisurely in his movements, however, and is satisfied. It will be well for him to be (as sincere) as in sacrificing (to spiritual beings).","plain":"Hurt from above and below, oppressed by those in authority. Joy returns slowly. Remain sincere, as in an act of devotion."},{"legge":"The sixth SIX, divided, shows its subject straitened, as if bound with creepers; or in a high and dangerous position, and saying (to himself), 'If I move, I shall repent it.' If he do repent of former errors, there will be good fortune in his going forward.","plain":"Tangled in creeping vines and anxious, telling yourself that any move will bring regret. If you recognize your past mistakes and act anyway, good fortune comes."}]},{"n":48,"zh":"井","pinyin":"Jǐng","legge":"Zing","name":"The Well","alt":"The Source","glyph":"䷯","lower":"xun","upper":"kan","bits":"011010","keywords":["resources","community","renewal","depth","service"],"core":"a time to return to a deep and lasting source, maintaining what nourishes everyone","now":"Water above wood: the bucket rises from the well. The Well describes a source that remains constant while towns change around it. The text says the town may change, but the well cannot be changed; people come and go and draw from it. But if the rope is too short or the jug breaks, misfortune results. The well represents the deep resources that nourish life — human nature, shared wisdom, community. Make sure they are maintained and accessible.","dir":"The situation may be moving toward a return to deeper sources of nourishment and wisdom. Maintaining and sharing them will be important.","do":["Draw on deep, lasting resources","Maintain what serves the community","Go deep rather than superficial"],"avoid":["Neglecting essential infrastructure","Stopping halfway"],"love":"Return to the shared source of your relationship: values, friendship and care.","work":"Maintain systems and relationships that serve everyone. Invest in fundamentals.","self":"Seek deeper sources of meaning and wisdom.","jung":"The Well may symbolize the collective unconscious — the deep, shared source of images and meaning from which every individual draws.","example":"Repairing community resources, returning to spiritual practice, or drawing on a mentor's deep wisdom.","judgment":"(Looking at) Žing, (we think of) how (the site of) a town may be changed, while (the fashion of) its wells undergoes no change. (The water of a well) never disappears and never receives (any great) increase, and those who come and those who go can draw and enjoy the benefit. If (the drawing) have nearly been accomplished, but, before the rope has quite reached the water, the bucket is broken, this is evil.","image":"(The trigram representing) wood and above it that for water form Žing. The superior man, in accordance with this, comforts the people, and. stimulates them to mutual helpfulness.","lines":[{"legge":"The first SIX, divided, shows a well so muddy that men will not drink of it; or an old well to which neither birds (nor other creatures) resort.","plain":"The well is muddy and nobody drinks from it; even animals do not visit an old well. Neglected resources or skills become useless."},{"legge":"The second NINE, undivided, shows a well from which by a hole the water escapes and flows away to the shrimps (and such small creatures among the grass), or one the water of which leaks away from a broken basket.","plain":"Water leaks from the well toward the small fish, or the jug is cracked and leaks. Your resources are being wasted on trivial things."},{"legge":"The third NINE, undivided, shows a well, which has been cleared out, but is not used. Our hearts are sorry for this, for the water might be drawn out and used. If the king were (only) intelligent, both he and we might receive the benefit of it.","plain":"The well has been cleaned, but nobody drinks. This is a source of sadness. If those in authority recognized its value, everyone would benefit."},{"legge":"The fourth SIX, divided, shows a well, the lining of which is well laid. There will be no error.","plain":"The well is being lined with stone. Repairing and strengthening the source takes time, and no one is to blame for the pause."},{"legge":"The fifth NINE, undivided, shows a clear, limpid well, (the waters from) whose cold spring are (freely) drunk.","plain":"The well holds clear, cold spring water that people can drink. Your resources are ready and valuable."},{"legge":"The topmost SIX, divided, shows (the water from) the well brought to the top, which is not allowed to be covered. This suggests the idea of sincerity. There will be great good fortune.","plain":"Water is drawn freely, and the well is left open for everyone. A dependable source, shared sincerely, brings great good fortune."}]},{"n":49,"zh":"革","pinyin":"Gé","legge":"Ko","name":"Revolution","alt":"Radical Change","glyph":"䷰","lower":"li","upper":"dui","bits":"101110","keywords":["change","transformation","timing","renewal","conviction"],"core":"a time of fundamental change, which succeeds when the moment is right and people trust the reason for it","now":"Fire within the lake: two forces that cannot both stay as they are. Revolution describes a deep transformation, like an animal shedding its old coat. The traditional text says that people will believe in the change only \"on the day of its completion\", and that firm correctness makes regret disappear. Real change needs the right timing, a clear and fair purpose, and the trust of others. The Image advises the wise person to set the calendar in order and make the seasons clear — understand the rhythm of time before you overturn what exists.","dir":"The situation may be moving toward a fundamental change. When the time is right and your motives are clear, transformation can bring renewal.","do":["Make sure change is truly necessary and well-timed","Explain your reasons so others can trust them","Change what is outdated, keep what is sound"],"avoid":["Changing things for the sake of change","Acting before you have support or clarity"],"love":"The relationship may need to change its old patterns. Talk openly about what must be different, and change together.","work":"Outdated structures or methods may need to be replaced. Prepare carefully and communicate clearly.","self":"You may be ready to shed an old identity or habit. Let the new you emerge at a natural pace.","jung":"Revolution can describe a fundamental shift in attitude, the kind of transformation Jung associated with the process of individuation, when an old way of being no longer fits and a new orientation emerges.","example":"Changing careers, ending a habit that defined you, or transforming how a team or family works.","judgment":"(What takes place as indicated by) Ko is believed in only after it has been accomplished. There will be great progress and success. Advantage will come from being firm and correct. (In that case) occasion for repentance will disappear.","image":"(The trigram representing the waters of) a marsh and that for fire in the midst of them form Ko. The superior man, in accordance with this, regulates his (astronomical) calculations, and makes clear the seasons and times.","lines":[{"legge":"The first NINE, undivided, shows its subject (as if he were) bound with the skin of a yellow ox.","plain":"Wrapped in the hide of a yellow ox. It is too early to act. Hold firm and let the time for change mature."},{"legge":"The second SIX, divided, shows its subject making his changes after some time has passed. Action taken will be fortunate. There will be no error.","plain":"When the day comes, carry out the change. The time is now right; going forward brings good fortune and no blame."},{"legge":"The third NINE, undivided, shows that action taken by its subject will be evil. Though he be firm and correct, his position is perilous. If the change (he contemplates) have been three times fully discussed, he will be believed in.","plain":"Charging ahead brings misfortune, and stubbornness is dangerous. Only when talk of change has been considered three times does it deserve trust. Check your plans carefully."},{"legge":"The fourth NINE, undivided, shows occasion for repentance disappearing (from its subject). Let him be believed in; and though he change (existing) ordinances, there will be good fortune.","plain":"Regret disappears. People trust you, and changing the old order now brings good fortune. Sincerity gives the change its legitimacy."},{"legge":"The fifth NINE, undivided, shows the great man (producing his changes) as the tiger (does when he) changes (his stripes). Before he divines (and proceeds to action), faith has been reposed in him.","plain":"The great person changes like a tiger, whose stripes are clear and bright. The change is so evident that no oracle is needed; people trust it."},{"legge":"The sixth SIX, divided, shows the superior man producing his changes as the leopard (does when he) changes (his spots), while small men change their faces (and show their obedience). To go forward (now) would lead to evil, but there will be good fortune in abiding firm and correct.","plain":"The superior person changes like a leopard, the petty person changes only their face. After the main change, do not keep pushing. Settling down and staying firm brings good fortune."}]},{"n":50,"zh":"鼎","pinyin":"Dǐng","legge":"Ting","name":"The Cauldron","alt":"Nourishing Transformation","glyph":"䷱","lower":"xun","upper":"li","bits":"011101","keywords":["transformation","nourishment","culture","refinement","value"],"core":"a time of refinement and nourishing transformation, when raw materials become something of lasting value","now":"Fire over wood: a sacred bronze cauldron in which food is cooked and offerings are prepared. The Cauldron is one of the few hexagrams that represents a man-made object, and it stands for culture, refinement and spiritual nourishment. The text promises supreme good fortune and success. Like cooking, transformation needs the right vessel, the right ingredients and the right heat. Put your gifts to good use and serve something larger than yourself.","dir":"The situation may be moving toward refinement and transformation, where raw potential becomes something nourishing and valuable.","do":["Turn raw ideas or talents into something of value","Serve a purpose larger than yourself","Respect tradition while renewing it"],"avoid":["Wasting talents","Carrying more than the vessel can hold"],"love":"Nourish the relationship with care, shared values and meaningful rituals.","work":"Refine products, skills or teams into something of lasting value.","self":"Your talents are being refined. Use them to nourish others.","jung":"The Cauldron resembles the alchemical vessel, a symbol Jung used for the container in which psychological transformation happens. Raw emotion and experience are \"cooked\" into insight.","example":"Developing a skill into a craft, preparing a meaningful meal or ceremony, or transforming experience into wisdom.","judgment":"Ting gives the intimation of great progress and success.","image":"(The trigram representing) wood and above it that for fire form Ting. The superior man, in accordance with this, keeps his every position correct, and maintains secure the appointment (of Heaven).","lines":[{"legge":"The first SIX, divided, shows the caldron overthrown and its feet turned up. (But) there will be advantage in its getting rid of what was bad in it. (Or it shows us) the concubine (whose position is improved) by means of her son. There will be no error.","plain":"The cauldron is turned upside down to empty out old residue. Clearing away what is spoiled is helpful, even if it seems unusual. No blame."},{"legge":"The second NINE, undivided, shows the caldron with the things (to be cooked) in it. (If its subject can say), 'My enemy dislikes me, but he cannot approach me,' there will be good fortune.","plain":"The cauldron has food in it. Others may envy you, but they cannot harm you. Keep your substance and stay focused. Good fortune."},{"legge":"The third NINE, undivided, shows the caldron with (the places of) its ears changed. The progress (of its subject) is (thus) stopped. The fat flesh of the pheasant (which is in the caldron) will not be eaten. But the (genial) rain will come, and the grounds for repentance will disappear. There will be good fortune in the end.","plain":"The handle of the cauldron is changed, so it cannot be lifted, and the good food is not eaten. Your gifts are not being used. Wait; when the rain comes, regret disappears and good fortune follows."},{"legge":"The fourth NINE, undivided, shows the caldron with its feet broken; and its contents, designed for the ruler's use, overturned and spilt. Its Subject will be made to blush for shame. There will be evil.","plain":"The cauldron's leg breaks and the prince's meal is spilled. Taking on more than you can handle leads to failure and embarrassment."},{"legge":"The fifth six, divided, shows the caldron with yellow ears and rings of metal in them. There will be advantage through being firm and correct.","plain":"The cauldron has yellow handles and golden carrying rings. You are open to help and good advice. Firmness brings benefit."},{"legge":"The sixth NINE, undivided, shows the caldron with rings of jade. There will be great good fortune, and all action taken will be in every way advantageous.","plain":"The cauldron has rings of jade. Great good fortune; everything is beneficial. Wisdom and gentleness are in harmony."}]},{"n":51,"zh":"震","pinyin":"Zhèn","legge":"Kăn","name":"The Arousing","alt":"Shock, Thunder","glyph":"䷲","lower":"zhen","upper":"zhen","bits":"100100","keywords":["shock","awakening","fear","composure","renewal"],"core":"a sudden shock or upheaval that frightens at first but can awaken you and lead to composure and growth","now":"Thunder repeated: a sudden shock. The Arousing describes events that startle and shake you. The traditional text describes the shock coming — \"oh, oh!\" — then laughter — \"ha, ha!\" — and says that even when the thunder terrifies for a hundred miles, the steady person does not drop the sacrificial spoon and cup. Shock can awaken you. The Image advises reflecting on yourself and setting your life in order. Fear passes; what remains is the lesson.","dir":"The situation may be moving toward a shock or sudden change. Stay composed; it can awaken you to something important.","do":["Stay calm when shocks occur","Use the shock to examine and correct yourself","Return to stability after the surprise"],"avoid":["Panic","Ignoring the lesson of a shock"],"love":"An unexpected event may shake the relationship. Stay steady and talk through what happened.","work":"Sudden changes may occur. Keep composure and adapt quickly.","self":"A shock can wake you up. Ask what it is showing you.","jung":"The Arousing may describe a sudden irruption from the unconscious — an event, dream or emotion that shakes the ego out of complacency and opens it to change.","example":"An unexpected job loss, a health scare, or sudden news that changes your perspective.","judgment":"Kăn gives the intimation of ease and development. When (the time of) movement (which it indicates) comes, (the subject of the hexagram) will be found looking out with apprehension, and yet smiling and talking cheerfully. When the movement (like a crash of thunder) terrifies all within a hundred lî, he will be (like the sincere worshipper) who is not (startled into) letting go his ladle and (cup of) sacrificial spirits.","image":"(The trigram representing) thunder, being repeated, forms Kăn. The superior man, in accordance with this, is fearful and apprehensive, cultivates (his virtue), and examines (his faults).","lines":[{"legge":"The first NINE, undivided, shows its subject, when the movement approaches, looking out and around with apprehension, and afterwards smiling and talking cheerfully. There will be good fortune.","plain":"Shock comes with fear and trembling, then laughter and relief. Good fortune follows the scare."},{"legge":"The second SIX, divided, shows its subject, when the movement approaches, in a position of peril. He judges it better to let go the articles (in his possession), and to ascend a very lofty height. There is no occasion for him to pursue after (the things he has let go); in seven days he will find them.","plain":"Shock brings danger and you lose your treasures. Climb to higher ground and do not chase what is lost; in seven days it will return."},{"legge":"The third six, divided, shows its subject distraught amid the startling movements going on. If those movements excite him to (right) action, there will be no mistake.","plain":"Shock leaves you distraught. If shock moves you to act correctly, there is no harm."},{"legge":"The fourth NINE, undivided, shows its subject, amid the startling movements, supinely sinking (deeper) in the mud.","plain":"S
