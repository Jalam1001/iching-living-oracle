ct patient and obedient. To the small man (comporting himself so) there will be good fortune. If the great man (comport himself) as the distress and obstruction require, he will have success.","plain":"Patience and compliance help ordinary people, but the great person accepts standstill and does not compromise. This leads to success."},{"legge":"The third SIX, divided, shows its subject ashamed of the purpose folded (in his breast).","plain":"Hidden shame. Recognizing what you have done wrong is the first step to change."},{"legge":"The fourth NINE, undivided, shows its subject acting in accordance with the ordination (of Heaven), and committing no error. His companions will come and share in his happiness.","plain":"Acting according to a higher calling, without blame. Those who share the same values will find blessings."},{"legge":"In the fifth NINE, undivided, we see him who brings the distress and obstruction to a close,--the great man and fortunate. (But let him say), 'We may perish! We may perish!' (so shall the state of things become firm, as if) bound to a clump of bushy mulberry trees.","plain":"Standstill is ending. Remain alert: \"What if it should fail? What if it should fail?\" Care makes success secure, like tying it to a mulberry tree."},{"legge":"The sixth NINE, undivided, shows the overthrow (and removal of) the condition of distress and obstruction. Before this there was that condition. Hereafter there will be joy.","plain":"Standstill is overturned. First there is obstruction, then there is joy."}]},{"n":13,"zh":"同人","pinyin":"Tóng Rén","legge":"Thung Zăn","name":"Fellowship","alt":"Fellowship with People","glyph":"䷌","lower":"li","upper":"qian","bits":"101111","keywords":["community","cooperation","shared purpose","openness","friendship"],"core":"a time of fellowship, when open cooperation around shared values achieves what individuals cannot","now":"Fellowship describes people united by a shared purpose, like fire rising toward heaven. True community is built on openness and common values, not on private interests or narrow cliques. The text says fellowship \"in the open\" brings success and makes it possible to cross the great water — to achieve great things together. Look for where you can cooperate, include others and build trust across differences.","dir":"The situation may be moving toward cooperation and community. Shared goals and open-mindedness will make progress possible.","do":["Look for common ground with others","Be open, inclusive and honest","Work toward shared goals"],"avoid":["Cliques and exclusive loyalties","Hidden agendas"],"love":"Shared values and friendship are the foundation now. Do things together that matter to both of you.","work":"Collaborate openly. Build alliances across teams or departments.","self":"Connect with communities that share your values. You do not have to do everything alone.","jung":"Fellowship can symbolize the integration of different parts of the personality around a common purpose. Outwardly, it reflects the human need for community. Inwardly, it suggests reconciling conflicting aspects of yourself.","example":"Volunteers organizing a neighbourhood event, a team working on a shared project, or friends supporting each other through change.","judgment":"Thung Zăn (or 'Union of men') appears here (as we find it) in the (remote districts of the) country, indicating progress and success. It will be advantageous to cross the great stream. It will be advantageous to maintain the firm correctness of the superior man.","image":"(The trigrams for) heaven and fire form Thung Zăn. The superior man, in accordance with this), distinguishes things according to their kinds and classes.","lines":[{"legge":"The first NINE, undivided, (shows the representative of) the union of men just issuing from his gate. There will be no error.","plain":"Fellowship at the gate. Open cooperation from the start brings no blame."},{"legge":"The second SIX, divided, (shows the representative of) the union of men in relation with his kindred. There will be occasion for regret.","plain":"Fellowship limited to your own clan. Narrow loyalties lead to regret."},{"legge":"The third NINE, undivided, (shows its subject) with his arms hidden in the thick grass, and at the top of a high mound. (But) for three years he makes no demonstration.","plain":"Weapons hidden in the bushes; watching from a high hill. Suspicion prevents fellowship for a long time."},{"legge":"The fourth NINE, undivided, (shows its subject) mounted on the city wall; but he does not proceed to make the attack (he contemplates). There will be good fortune.","plain":"Climbing the wall but not attacking. Realizing you cannot win by force, you turn back — good fortune."},{"legge":"In the fifth NINE, undivided, (the representative of) the union of men first wails and cries out, and then laughs. His great host conquers, and he (and the subject of the second line) meet together.","plain":"Friends first weep and then laugh. After struggle, great forces come together and meet."},{"legge":"The topmost NINE, undivided, (shows the representative of) the union of men in the suburbs. There will be no occasion for repentance.","plain":"Fellowship in the meadow outside the city. Not the deepest union, but no regret."}]},{"n":14,"zh":"大有","pinyin":"Dà Yǒu","legge":"Tâ Yû","name":"Possession in Great Measure","alt":"Great Possession","glyph":"䷍","lower":"qian","upper":"li","bits":"111101","keywords":["abundance","success","responsibility","generosity","clarity"],"core":"a time of abundance and success, which lasts when it is handled with modesty, clarity and generosity","now":"Fire high in the heavens shines on everything below. This hexagram describes great possession: success, resources or influence. The text promises supreme success. The real question is how you use what you have. Abundance brings responsibility. Modesty, generosity and good judgment keep success healthy, while pride and wastefulness undermine it. Make sure your success serves something good.","dir":"The situation may be moving toward success and abundance. It will be important to use your resources wisely and generously.","do":["Use resources wisely and generously","Stay modest and grounded","Support good causes and good people"],"avoid":["Arrogance and showing off","Wasting resources"],"love":"Share your good fortune and appreciation generously. Do not let success create distance.","work":"A prosperous time. Invest wisely, reward your team and avoid overconfidence.","self":"Recognize your blessings and consider how to share them.","jung":"Great Possession may point to psychic wealth: talents, energy and insight. The task is to use them consciously, without becoming inflated by them.","example":"Receiving a promotion, an inheritance or recognition, and deciding how to use it responsibly.","judgment":"Tâ Yû indicates that, (under the circumstances which it implies), there will be great progress and success.","image":"(The trigram for) heaven and (that of) fire above it form Tâ Yû The superior man, in accordance with this, represses what is evil and gives distinction to what is good, in sympathy with the excellent Heaven-conferred (nature).","lines":[{"legge":"In the first NINE, undivided, there is no approach to what is injurious, and there is no error. Let there be a realisation of the difficulty (and danger of the position), and there will be no error (to the end).","plain":"No relationship with harm yet. Abundance has not caused problems; stay aware of difficulty and remain blameless."},{"legge":"In the second NINE, undivided, we have a large waggon with its load. In whatever direction advance is made, there will be no error.","plain":"A big wagon for loading. You have the means to carry a great deal. Move forward; there is no blame."},{"legge":"The third NINE, undivided, shows us a feudal prince presenting his offerings to the Son of Heaven. A small man would be unequal (to such a duty).","plain":"A prince offers his wealth to the Son of Heaven. Use your resources for a higher purpose; a petty person cannot do this."},{"legge":"The fourth NINE, undivided, shows its subject keeping his great resources under restraint. There will be no error.","plain":"He does not show off his wealth. Restraint and modesty keep you free from blame."},{"legge":"The fifth SIX, divided, shows the sincerity of its subject reciprocated by that of all the others (represented in the hexagram). Let him display a proper majesty, and there will be good fortune.","plain":"Sincerity that is accessible yet dignified. Natural authority brings good fortune."},{"legge":"The topmost NINE, undivided, shows its subject with help accorded to him from Heaven. There will be good fortune, advantage in every respect.","plain":"Blessed by heaven. Good fortune; nothing that does not benefit."}]},{"n":15,"zh":"謙","pinyin":"Qiān","legge":"Khien","name":"Modesty","alt":"Humility","glyph":"䷎","lower":"gen","upper":"kun","bits":"001000","keywords":["humility","balance","moderation","quiet strength","fairness"],"core":"a time when modesty and quiet strength bring success, balancing too much and too little","now":"A mountain hidden within the earth: great strength that does not display itself. Modesty describes a person who has real worth but does not boast. The text says modesty brings success and allows the superior person to carry things through to completion. Modesty here is not low self-esteem; it is a balanced attitude that reduces excess and increases what is lacking. It creates trust and lasting influence.","dir":"The situation may be moving toward a phase where modesty and quiet competence achieve more than self-promotion.","do":["Let your work speak for itself","Balance excess and deficiency fairly","Listen and learn from others"],"avoid":["Boasting or self-promotion","False humility used to seek praise"],"love":"Show appreciation and avoid trying to look superior. Humility creates closeness.","work":"Quiet competence will be noticed. Credit others generously.","self":"Measure yourself honestly — not too high, not too low.","jung":"Modesty may describe an ego that does not inflate itself, either upward into grandiosity or downward into worthlessness. It is in right relationship to the larger Self.","example":"An expert who listens carefully to beginners, or a team leader who shares credit.","judgment":"Khien indicates progress and success. The superior man, (being humble as it implies), will have a (good) issue (to his undertakings).","image":"(The trigram for) the earth and (that of) a mountain in the midst of it form Khien. The superior man, in accordance with this, diminishes what is excessive (in himself), and increases where there is any defect, bringing about an equality, according to the nature of the case, in his treatment (of himself and others).","lines":[{"legge":"The first SIX, divided, shows us the superior man who adds humility to humility. (Even) the great stream may be crossed with this, and there will be good fortune.","plain":"Very modest. The superior person crosses great water. Humility makes big undertakings possible."},{"legge":"The second SIX, divided, shows us humility that has made itself recognised. With firm correctness there will be good fortune.","plain":"Modesty that comes to expression. Recognized humility brings good fortune."},{"legge":"The third NINE, undivided, shows the superior man of (acknowledged) merit. He will maintain his success to the end, and have good fortune.","plain":"Hard-working modesty. Labour without boasting brings success to completion."},{"legge":"The fourth SIX, divided, shows one, whose action would be in every way advantageous, stirring up (the more) his humility.","plain":"Nothing that does not benefit modesty in action. Use humility actively, not as passivity."},{"legge":"The fifth SIX, divided, shows one who, without being rich, is able to employ his neighbours. He may advantageously use the force of arms. All his movements will be advantageous.","plain":"Without relying on wealth, you win the support of your neighbours. Firm, even forceful, action is justified now when something must be corrected."},{"legge":"The sixth SIX, divided, shows us humility that has made itself recognised. The subject of it will with advantage put his hosts in motion; but (he will only) punish his own towns and state.","plain":"Modesty that has been recognized. Using it, you can set things right in your own sphere."}]},{"n":16,"zh":"豫","pinyin":"Yù","legge":"Yü","name":"Enthusiasm","alt":"Delight","glyph":"䷏","lower":"kun","upper":"zhen","bits":"000100","keywords":["enthusiasm","motivation","inspiration","readiness","harmony"],"core":"a time of enthusiasm and inspired energy, which moves people when it is grounded and sincere","now":"Thunder bursts from the earth: energy is released and people are stirred. Enthusiasm describes a time of inspiration, motivation and shared feeling. The text says it is good for setting up helpers and putting armies in motion — mobilizing people. Enthusiasm is powerful but needs grounding. Joy that comes from genuine harmony moves people; excitement that is self-indulgent or empty fades quickly. Be sincere, prepared and attentive to the mood of others.","dir":"The situation may be moving toward a phase of enthusiasm and mobilization. Inspired energy can move people if it is sincere and well-directed.","do":["Share your enthusiasm with others","Prepare and organize so energy is not wasted","Stay connected to genuine purpose"],"avoid":["Complacency and self-indulgence","Overconfidence when things feel easy"],"love":"Bring joy and playfulness into the relationship, but stay attentive to how the other person really feels.","work":"A good time to inspire a team or launch a campaign. Plan carefully so energy translates into results.","self":"Follow what genuinely excites you, but do not lose yourself in pleasure.","jung":"Enthusiasm can describe a surge of psychic energy, often from the unconscious. Such energy can heal and inspire, but can also overwhelm judgement if it is not integrated.","example":"Starting a new hobby with excitement, motivating a team before a big event, or the joy of a celebration.","judgment":"Yü indicates that, (in the state which it implies), feudal princes may be set up, and the hosts put in motion, with advantage.","image":"(The trigrams for) the earth and thunder issuing from it with its crashing noise form Yü. The ancient kings, in accordance with this, composed their music and did honour to virtue, presenting it especially and most grandly to God, when they associated with Him (at the service) their highest ancestor and their father.","lines":[{"legge":"The first SIX, divided, shows its subject proclaiming his pleasure and satisfaction. There will be evil.","plain":"Boasting about one's enthusiasm. Self-indulgent display brings misfortune."},{"legge":"The second SIX, divided, shows one who is firm as a rock. (He sees a thing) without waiting till it has come to pass; with his firm correctness there will be good fortune.","plain":"Firm as a rock. Recognizing the signs early and acting correctly brings good fortune."},{"legge":"The third SIX, divided, shows one looking up (for favours), while he indulges the feeling of pleasure and satisfaction. If he would understand!--If he be late in doing so, there will indeed be occasion for repentance.","plain":"Looking upward for enthusiasm, waiting for approval. Hesitation brings regret."},{"legge":"The fourth NINE, undivided, shows him from whom the harmony and satisfaction come. Great is the success which he obtains. Let him not allow suspicions to enter his mind, and thus friends will gather around him.","plain":"The source of enthusiasm. Great achievements are possible; do not doubt and others will gather around you."},{"legge":"The fifth six, divided, shows one with a chronic complaint, but who lives on without dying.","plain":"Chronically ill but not dying. Persistent pressure keeps you from false enthusiasm and helps you survive."},{"legge":"The topmost six, divided, shows its subject with darkened mind devoted to the pleasure and satisfaction (of the time); but if he change his course even when (it may be considered as) completed, there will be no error.","plain":"Deluded enthusiasm. If you change course even late, there is no blame."}]},{"n":17,"zh":"隨","pinyin":"Suí","legge":"Sui","name":"Following","alt":"Adapting","glyph":"䷐","lower":"zhen","upper":"dui","bits":"100110","keywords":["following","adaptability","trust","responsiveness","leadership by example"],"core":"a time to follow wisely, adapting to circumstances and to worthy leadership without losing your principles","now":"Thunder rests within the lake: energy adapts to the season. Following describes a time when the right response is to adapt and follow — whether that means following a worthy leader, a natural rhythm or the needs of the moment. The text promises supreme success when following remains correct. Good following is not blind obedience; it is choosing what deserves to be followed. Equally, if you lead, people will follow you willingly only if you first serve their needs.","dir":"The situation may be moving toward a phase of adaptation, when flexibility and wise choices about whom or what to follow are important.","do":["Adapt to changing circumstances","Choose carefully what and whom you follow","Rest and recover when the time calls for it"],"avoid":["Following blindly or for selfish gain","Clinging rigidly to old plans"],"love":"Be willing to adapt to your partner's needs and rhythms, while staying true to yourself.","work":"Follow good leadership or adapt to market conditions. Leading by serving others earns loyalty.","self":"Let go of rigidity. Flexibility can be a sign of strength.","jung":"Following may describe the ego's willingness to follow the guidance of the deeper Self, which Jung saw as the center and guide of psychological development. It also raises the question of projection: whom do we follow, and why?","example":"Joining a respected mentor's project, adapting to a new workplace culture, or responding to a child's changing needs.","judgment":"Sui indicates that (under its conditions) there will be great progress and success. But it will be advantageous to be firm and correct. There will (then) be no error.","image":"(The trigram for the waters of) a marsh and (that for) thunder (hidden) in the midst of it form Sui. The superior man in accordance with this, when it is getting towards dark, enters (his house) and rests.","lines":[{"legge":"The first NINE, undivided, shows us one changing the object of his pursuit; but if he be firm and correct, there will he good fortune. Going beyond (his own) gate to find associates, he will achieve merit.","plain":"The standard changes. Go out of your own door to mix with others; achievements come."},{"legge":"The second SIX, divided, shows us one who cleaves to the little boy, and lets go the man of age and experience.","plain":"Clinging to the little boy, you lose the strong man. Do not attach yourself to the wrong person or the lesser option."},{"legge":"The third SIX, divided, shows us one who cleaves to the man of age and experience, and lets go. the little boy. Such following will get what it seeks; but it will be advantageous to adhere to what is firm and correct.","plain":"Clinging to the strong man, you let go of the little boy. Following what is worthy means giving something up. Stay firm."},{"legge":"The fourth NINE, undivided, shows us one followed and obtaining (adherents). Though he be firm and correct, there will be evil. If he be sincere (however) in his course, and make that evident, into what error will he fall?","plain":"Following brings success, but persistence in this brings misfortune if motives are selfish. Sincerity and clarity remove blame."},{"legge":"The fifth NINE, undivided, shows us (the ruler) sincere in (fostering all) that is excellent. There will be good fortune.","plain":"Sincere in pursuing the good. Good fortune."},{"legge":"The topmost SIX, divided, shows us (that sincerity) firmly held and clung to, yea, and bound fast. (We see) the king with it presenting his offerings on the western mountain.","plain":"Firmly bound in loyalty. The king offers to the western mountain. Deep commitment that endures."}]},{"n":18,"zh":"蠱","pinyin":"Gǔ","legge":"Kû","name":"Work on What Has Been Spoiled","alt":"Repairing Decay","glyph":"䷑","lower":"xun","upper":"gen","bits":"011001","keywords":["repair","renewal","responsibility","family patterns","correction"],"core":"a time to repair what has decayed, especially problems inherited from the past","now":"Wind blows low beneath the mountain, and things become stagnant. The character for this hexagram shows worms in a bowl: something has decayed through neglect. The text says this can lead to great success and advises reflecting on what came three days before and planning what comes three days after — understand the causes, then plan carefully. You may be dealing with problems inherited from the past, perhaps family patterns, old habits or neglected obligations. Repair is possible, but it requires honesty and effort.","dir":"The situation may be moving toward a time of repair and renewal. Old problems or neglect will need to be faced honestly.","do":["Identify the root causes of problems","Take responsibility for repair","Plan carefully before and after acting"],"avoid":["Ignoring problems that keep returning","Blaming others without taking action"],"love":"Address old wounds or recurring patterns honestly. Repair trust step by step.","work":"Fix underlying problems rather than covering them up. Restructure what is not working.","self":"Examine inherited habits and beliefs. Decide which to keep and which to change.","jung":"Work on What Has Been Spoiled can point to inherited psychological patterns, family complexes passed from parents to children. Becoming conscious of them is the first step to breaking their hold.","example":"Repairing a neglected house, reforming a struggling organization, or healing family relationships after years of tension.","judgment":"Kû indicates great progress and success (to him who deals properly with the condition represented by it). There will be advantage in (efforts like that of) crossing the great stream. (He should weigh well, however, the events of) three days before the turning point, and those (to be done) three days after it.","image":"(The trigram for) a mountain, and below it that for wind, form Kû. The superior man, in accordance with this, (addresses himself to) help the people and nourish his own virtue.","lines":[{"legge":"The first SIX, divided, shows (a son) dealing with the troubles caused by his father. If he be an (able) son, the father will escape the blame of having erred. The position is perilous, but there will be good fortune in the end.","plain":"Setting right what the father spoiled. If the son is capable, the father is free of blame. Danger exists, but good fortune comes in the end."},{"legge":"The second NINE, undivided, shows (a son) dealing with the troubles caused by his mother. He should not (carry) his firm correctness (to the utmost).","plain":"Setting right what the mother spoiled. Be gentle; do not be too rigid."},{"legge":"The third NINE, undivided, shows (a son) dealing with the troubles caused by his father. There may be some small occasion for repentance, but there will not be any great error.","plain":"Setting right what the father spoiled. There may be slight regret, but no great blame."},{"legge":"The fourth SIX, divided, shows (a son) viewing indulgently the troubles caused by his father. If he go forward, he will find cause to regret it.","plain":"Tolerating what the father spoiled. Continuing to look away leads to humiliation."},{"legge":"The fifth SIX, divided, shows (a son) dealing with the troubles caused by his father. He obtains the praise of using (the fit instrument for his work).","plain":"Setting right what the father spoiled earns praise. Repairing with good help brings honour."},{"legge":"The sixth NINE, undivided, shows us one who does not serve either king or feudal lord, but in a lofty spirit prefers (to attend to) his own affairs.","plain":"Not serving kings and princes, setting higher goals. Some people step back from public affairs to cultivate inner values."}]},{"n":19,"zh":"臨","pinyin":"Lín","legge":"Lin","name":"Approach","alt":"Drawing Near","glyph":"䷒","lower":"dui","upper":"kun","bits":"110000","keywords":["approach","growth","leadership","opportunity","care"],"core":"a time of approach and growing influence, when kindness and teaching strengthen relationships before the season turns","now":"The earth stands above the lake, close and caring. Approach describes a time when something good draws near: opportunities, influence or relationships grow. The text promises great success but warns that \"in the eighth month there will be misfortune\" — favourable seasons do not last forever. Use this time well. Approach people with warmth and patience, teach and support others, and prepare for the change that will eventually come.","dir":"The situation may be moving toward growth and new opportunities. Use the favourable time wisely and remember that it will not last forever.","do":["Make the most of favourable conditions","Approach people with kindness and patience","Prepare for future change"],"avoid":["Complacency","Assuming good times will last forever"],"love":"Draw closer with warmth and care. A good time to deepen connection.","work":"Influence is growing. Mentor others and expand thoughtfully.","self":"You are growing. Use this momentum to build lasting habits.","jung":"Approach may describe the conscious mind drawing near to new content from the unconscious. It is a time of opening and receptivity, when insights and new attitudes can be accepted.","example":"A new supervisor getting to know the team, or a growing friendship that is deepening.","judgment":"Lin (indicates that under the conditions supposed in it) there will be great progress and success, while it will be advantageous to be firmly correct. In the eighth month there will be evil.","image":"(The trigram for) the waters of a marsh and that for the earth above it form Lin. The superior man, in accordance with this, has his purposes of instruction that are inexhaustible, and nourishes and supports the people without limit.","lines":[{"legge":"The first NINE, undivided, shows its subject advancing in company (with the subject of the second line). Through his firm correctness there will be good fortune.","plain":"You draw near together with others who share your aim. Influence that is shared, not grabbed, is welcome now. Stay correct and things go well."},{"legge":"The second NINE, undivided, shows its subject advancing in company (with the subject of the first line). There will be good fortune; (advancing) will be in every way advantageous.","plain":"Drawing near together, with full support. Everything you approach in this spirit is likely to go well, even what is still uncertain."},{"legge":"The third SIX, divided, shows one well pleased (indeed) to advance, (but whose action) will be in no way advantageous. If he become anxious about it (however), there will be no error.","plain":"Approaching with easy, sweet words but no real substance. Charm without sincerity achieves nothing. If you notice this and become genuinely concerned, the mistake is avoided."},{"legge":"The fourth SIX, divided, shows one advancing in the highest mode. There will be no error.","plain":"Drawing near fully and wholeheartedly, meeting people where they are. Complete, sincere engagement brings no blame."},{"legge":"The fifth SIX, divided, shows the advance of wisdom, such as befits the great ruler. There will be good fortune.","plain":"Approaching with wisdom, as a good ruler draws on capable people rather than doing everything alone. Delegating wisely brings good fortune."},{"legge":"The sixth SIX, divided, shows the advance of honesty and generosity. There will be good fortune, and no error.","plain":"Approaching with generosity and depth of heart, even from a position where you could stay aloof. Kindness offered freely brings good fortune and no blame."}]},{"n":20,"zh":"觀","pinyin":"Guān","legge":"Kwân","name":"Contemplation","alt":"View","glyph":"䷓","lower":"kun","upper":"xun","bits":"000011","keywords":["contemplation","observation","perspective","example","reflection"],"core":"a time of contemplation and observation, when understanding and good example matter more than action","now":"Wind moves over the earth, reaching everything. Contemplation shows a tower from which one sees widely, and also a person who is seen by others. The text describes the moment of a ritual when the worshipper has washed their hands but not yet made the offering: full of sincere attention. This is a time to observe, reflect and understand before acting. Your example and attitude influence others more than your words.","dir":"The situation may be moving toward a phase of reflection and observation. Understanding the larger picture will be more important than immediate action.","do":["Observe carefully before acting","Reflect on your own conduct and its effects","Set a good example"],"avoid":["Acting without understanding","Superficial judgement"],"love":"Observe and understand each other's needs. Quiet attention can deepen intimacy.","work":"Step back to see the big picture. Leaders influence by example.","self":"A good time for meditation, journaling or reflection.","jung":"Contemplation suggests turning attention inward to observe the movements of the psyche. Jung's method of active imagination involves this kind of patient, attentive observation of inner images.","example":"A manager observing how a team works before making changes, or a person reflecting on their life before a major decision.","judgment":"Kwân shows (how he whom it represents should be like) the worshipper who has washed his hands, but not (yet) presented his offerings;--with sincerity and an appearance of dignity (commanding reverent regard).","image":"(The trigram representing) the earth, and that for wind moving above it, form Kwan. The ancient kings, in accordance with this, examined the (different) regions (of the kingdom), to see the (ways of the) people, and set forth their instructions.","lines":[{"legge":"The first SIX, divided, shows the looking of a lad;--not blamable in men of inferior rank, but matter for regret in superior men.","plain":"Boyish contemplation. Shallow viewing is acceptable for ordinary people, but not for those who should know better."},{"legge":"The second SIX, divided, shows one peeping out from a door. It would be advantageous if it were (merely) the firm correctness of a female.","plain":"Contemplation through a crack in the door. A narrow view; acceptable only in limited contexts."},{"legge":"The third SIX, divided, shows one looking at (the course of) his own life, to advance or recede (accordingly).","plain":"Contemplating your own life to decide whether to advance or retreat. Self-examination guides your next step."},{"legge":"The fourth SIX, divided, shows one contemplating the glory of the kingdom. It will be advantageous for him, being such as he is, (to seek) to be a guest of the king.","plain":"Contemplating the light of the kingdom. Learning from those who govern well; be a guest of the king."},{"legge":"The fifth NINE, undivided, shows its subject contemplating his own life(-course). A superior man, he will (thus) fall into no error.","plain":"Contemplating your own life by looking at its effects on others. If those effects are good, you are on the right path and there is no blame."},{"legge":"The sixth NINE, undivided, shows its subject contemplating his character to see if it be indeed that of a superior man. He will not fall into error.","plain":"Contemplating your own character, as if from the outside, to see whether it is truly noble. Honest self-examination, even when you are no longer at the center of things, keeps you from error."}]},{"n":21,"zh":"噬嗑","pinyin":"Shì Kè","legge":"Shih Ho","name":"Biting Through","alt":"Clarifying Justice","glyph":"䷔","lower":"zhen","upper":"li","bits":"100101","keywords":["decisiveness","justice","obstacles","clarity","resolution"],"core":"a time to bite through obstacles decisively and fairly, bringing clarity and justice to a stuck situation","now":"Thunder and lightning: clarity combined with force. The image shows a mouth with something stuck between the teeth. Biting Through says an obstacle prevents things from coming together, and it must be dealt with energetically. The text favours \"the use of legal constraints\" — firm but just action. Whatever the obstacle is — a lie, a problem, a blocking person — it must be faced, understood and removed fairly.","dir":"The situation may be moving toward a moment that requires decisive action. Obstacles will need to be faced clearly and justly.","do":["Name the obstacle clearly","Act decisively but fairly","Set firm, appropriate consequences"],"avoid":["Tolerating deceit or obstruction","Excessive harshness"],"love":"If something is blocking closeness, address it directly and honestly.","work":"Remove the bottleneck. Enforce rules fairly and clarify misunderstandings.","self":"Face the habit or belief that keeps getting in the way.","jung":"Biting Through may describe the need to confront something unpleasant that the ego would rather avoid — a shadow quality or an uncomfortable truth.","example":"Ending a toxic agreement, resolving a long-standing misunderstanding, or confronting dishonest behaviour.","judgment":"Shih Ho indicates successful progress (in the condition of things which it supposes). It will be advantageous to use legal constraints.","image":"(The trigrams representing) thunder and lightning form Shih Ho. The ancient kings, in accordance with this, framed their penalties with intelligence, and promulgated their laws.","lines":[{"legge":"The first NINE, undivided, shows one with his feet in the stocks and deprived of his toes. There will be no error.","plain":"Feet fastened in the stocks, toes hidden. A small punishment early prevents larger mistakes. No blame."},{"legge":"The second SIX, divided, shows one biting through the soft flesh, and (going on to) bite off the nose. There will be no error.","plain":"Biting through soft meat until the nose disappears. Reacting a little too strongly, but no blame."},{"legge":"The third SIX, divided, shows one gnawing dried flesh, and meeting with what is disagreeable. There will be occasion for some small regret, but no (great) error.","plain":"Biting through old dried meat and meeting poison. A small humiliation, but no blame."},{"legge":"The fourth NINE, undivided, shows one gnawing the flesh dried on the bone, and getting the pledges of money and arrows. It will be advantageous to him to realise the difficulty of his task and be firm,--in which case there will be good fortune.","plain":"Biting through dried gristly meat and receiving metal arrows. Persist through difficulty. Good fortune."},{"legge":"The fifth SIX, divided, shows one gnawing at dried flesh, and finding the yellow gold. Let him be firm and correct, realising the peril (of his position). There will be no error.","plain":"Biting through dried lean meat and receiving yellow gold. Be firm and aware of danger. No blame."},{"legge":"The sixth NINE, undivided, shows one wearing the cangue, and deprived of his cars. There will be evil.","plain":"Wearing a cangue that covers the ears. Refusing to listen leads to misfortune."}]},{"n":22,"zh":"賁","pinyin":"Bì","legge":"Pî","name":"Grace","alt":"Adornment","glyph":"䷕","lower":"li","upper":"gen","bits":"101001","keywords":["beauty","form","presentation","culture","authenticity"],"core":"a time when beauty and form matter, though grace must remain true to the substance underneath","now":"Fire beneath the mountain lights up its beauty. Grace is about appearance, style and culture: the forms that make life pleasant and meaningful. The text says grace brings success in small matters. Beauty is valuable, but it is not enough for important decisions. Make sure the presentation is true to the substance. Elegance is at its best when simple.","dir":"The situation may be moving toward a phase where presentation, beauty and form become important. Keep substance and appearance in harmony.","do":["Present things clearly and attractively","Appreciate beauty and culture","Keep form true to substance"],"avoid":["Superficial decisions based on appearances","Using style to hide flaws"],"love":"Small gestures of beauty and care can delight, but deep connection needs more than appearance.","work":"Present your work well, but do not let polish replace quality.","self":"Express yourself creatively. Seek simple, authentic beauty.","jung":"Grace may symbolize the persona, the social face we present to the world. Jung saw it as necessary but warned against identifying with it. The question is whether the outer form expresses the inner truth.","example":"Preparing a presentation, decorating a home, or choosing an outfit for an important occasion.","judgment":"Pî indicates that there should be free course (in what it denotes). There will be little advantage (however) if it be allowed to advance (and take the lead).","image":"(The trigram representing) a mountain and that for fire under it form Pî. The superior man, in accordance with this, throws a brilliancy around his various processes of government, but does not dare (in a similar way) to decide cases of criminal litigation.","lines":[{"legge":"The first NINE, undivided, shows one adorning (the way of) his feet. He can discard a carriage and walk on foot.","plain":"Gracing the toes, leaving the carriage and walking. Simplicity is better than a borrowed show."},{"legge":"The second SIX, divided, shows one adorning his beard.","plain":"Gracing the beard. Form follows substance; adornment depends on what it adorns."},{"legge":"The third NINE, undivided, shows its subject with the appearance of being adorned and bedewed (with rich favours). But let him ever maintain his firm correctness, and there will be good fortune.","plain":"Graceful and moist. Lasting firmness brings good fortune; do not get lost in comfort."},{"legge":"The fourth SIX, divided, shows one looking as if adorned, but only in white. As if (mounted on) a white horse, and furnished with wings, (he seeks union with the subject of the first line), while (the intervening third pursues), not as a robber, but intent on a matrimonial alliance.","plain":"Grace or simplicity? A white horse comes as if on wings. A sincere partner, not an enemy, approaches."},{"legge":"The fifth SIX, divided, shows its subject adorned by (the occupants of) the heights and gardens. He bears his roll of silk, small and slight. He may appear stingy; but there will be good fortune in the end.","plain":"Grace in the hills and gardens. A small, modest gift. Humiliation at first, then good fortune."},{"legge":"The sixth NINE, undivided, shows one with white as his (only) ornament. There will be no error.","plain":"Simple grace. Natural simplicity brings no blame."}]},{"n":23,"zh":"剝","pinyin":"Bō","legge":"Po","name":"Splitting Apart","alt":"Stripping Away","glyph":"䷖","lower":"kun","upper":"gen","bits":"000001","keywords":["decline","collapse","letting go","endurance","patience"],"core":"a time of decline and stripping away, when it is wiser to wait than to push against collapse","now":"A mountain rests on the earth, but its base is crumbling. Splitting Apart describes a time when structures are breaking down, often from below. The text says it does not further you to go anywhere. This is not the time for bold action. Protect what is essential, be generous to those who depend on you, and wait. Decay is part of the natural cycle; after it, renewal comes.","dir":"The situation may be moving toward a phase of decline or loss. Protect what is essential and wait for renewal.","do":["Protect your core values and resources","Accept what cannot be saved","Be generous to those who rely on you"],"avoid":["Bold new undertakings","Fighting against inevitable change"],"love":"If a relationship is weakening, focus on what can be preserved rather than blaming. Some things need time.","work":"Avoid expansion. Protect essential resources and reputation.","self":"Let go of what no longer serves you. Endings make room for beginnings.","jung":"Splitting Apart can describe the breakdown of an old attitude or self-image. Painful as it is, such dissolution is often necessary before a new orientation can emerge from the unconscious.","example":"A business in decline, the end of a long relationship, or a period of declining health that calls for rest and acceptance.","judgment":"Po indicates that (in the state which it symbolises) it will not be advantageous to make a movement in any direction whatever.","image":"(The trigrams representing) the earth, and (above it) that for a mountain, which adheres to the earth, form Po. Superiors, in accordance with this, seek to strengthen those below them, to secure the peace and stability of their own position.","lines":[{"legge":"The first SIX, divided, shows one overturning the couch by injuring its legs. (The injury will go on to) the destruction of (all) firm correctness, and there will be evil.","plain":"The bed is being split at its legs. Decay starts at the foundation and undermines those who are loyal and upright. Recognize the danger early; it is serious."},{"legge":"The second SIX, divided, shows one overthrowing the couch by injuring its frame. (The injury will go on to) the destruction of (all) firm correctness, and there will be evil.","plain":"The damage reaches the frame of the bed. The erosion is spreading closer. Without support, standing firm alone is risky; protect yourself."},{"legge":"The third SIX, divided, shows its subject among the overthrowers; but there will be no error.","plain":"Among those who are splitting things apart, one stays connected to what is good. Breaking ranks with harmful company is right and brings no blame."},{"legge":"The fourth SIX, divided, shows its subject having overthrown the couch, and (going to injure) the skin (of him who lies on it). There will be evil.","plain":"The damage has reached the skin of the person lying on the bed. The danger is no longer distant; it touches you directly. This is a time for great care."},{"legge":"The fifth SIX, divided, shows (its subject leading on the others like) a string of fishes, and (obtaining for them) the favour that lights on the inmates of the palace. There will be advantage in every way.","plain":"Like a string of fish led in order, the people are brought into favour. The disorder is steered into a healthy direction, and everything benefits."},{"legge":"The topmost NINE, undivided, shows its subject (as) a great fruit which has not been eaten. The superior man finds (the people again) as a chariot carrying him. The small men (by their course) overthrow their own dwellings.","plain":"A large fruit still hangs on the tree, uneaten. A seed of goodness survives the collapse. A person of integrity will be carried by others; a petty person brings ruin on their own house."}]},{"n":24,"zh":"復","pinyin":"Fù","legge":"Fû","name":"Return","alt":"The Turning Point","glyph":"䷗","lower":"zhen","upper":"kun","bits":"100000","keywords":["return","renewal","turning point","recovery","natural cycles"],"core":"a turning point, when the light returns and something healthy begins again quietly","now":"Thunder within the earth: after the darkest point, the light returns. Return marks a turning point. One single solid line enters at the bottom, beneath five broken lines. The text says going out and coming in are without error, friends come, and on the seventh day comes return. Renewal begins quietly. Do not rush it. Rest, recover and let the new energy grow naturally. Returning to what is healthy, true and natural brings success.","dir":"The situation may be moving toward a turning point and a fresh start. Let new energy grow gently, without forcing it.","do":["Return to healthy habits and true values","Let renewal grow gently","Rest and recover"],"avoid":["Rushing the new beginning","Falling back into old mistakes"],"love":"A chance to reconnect or reconcile. Begin gently and rebuild trust.","work":"A good moment to restart a project or return to core strengths.","self":"Return to what nourishes you: rest, nature, honest reflection.","jung":"Return may describe the moment when psychic energy, after a period of depression or withdrawal, begins to flow back into consciousness. Jung called the return of libido after introversion a renewal of life.","example":"Recovering after an illness, returning to an old passion, or reconciling after a falling-out.","judgment":"Fû indicates that there will be free course and progress (in what it denotes). (The subject of it) finds no one to distress him in his exits and entrances; friends come to him, and no error is committed. He will return and repeat his (proper) course. In seven days comes his return. There will be advantage in whatever direction movement is made.","image":"(The trigram representing) the earth and that for thunder in the midst of it form Fû. The ancient kings, in accordance with this, on the day. of the (winter) solstice, shut the gates of the passes (from one state to another), so that the travelling merchants could not (then) pursue their journeys, nor the princes go on with the inspection of their states.","lines":[{"legge":"The first NINE, undivided, shows its subject returning (from an error) of no great extent, which would not proceed to anything requiring repentance. There will be great good fortune.","plain":"Turning back after only a short distance on the wrong path. Correcting a mistake early means there is nothing to regret. Great good fortune."},{"legge":"The second SIX, divided, shows the admirable return (of its subject). There will be good fortune.","plain":"A gentle, admirable return, helped by the good example of others. Coming back to what is right without stubbornness brings good fortune."},{"legge":"The third SIX, divided, shows one who has made repeated returns. The position is perilous, but there will be no error.","plain":"Returning again and again after repeated lapses. It is risky to keep slipping, but every return is still the right choice, so there is no blame."},{"legge":"The fourth SIX, divided, shows its subject moving right in the centre (among those represented by the other divided lines), and yet returning alone (to his proper path).","plain":"Walking in the middle of a crowd, you alone turn back to what is right. Following your conscience rather than the group is the right path."},{"legge":"The fifth SIX, divided, shows the noble return of its subject. There will be no ground for repentance.","plain":"A generous, sincere return of the heart. When the return comes from honest self-examination, there is no regret."},{"legge":"The topmost SIX, divided, shows its subject all astray on the subject of returning. There will be evil. There will be calamities and errors. If with his views he put the hosts in motion, the end will be a great defeat, whose issues will extend to the ruler of the state. Even in ten years he will not be able to repair the disaster.","plain":"Missing the moment to return and staying on the wrong course. This leads to misfortune that lasts. Forcing things through, especially with aggression, makes it worse for years."}]},{"n":25,"zh":"無妄","pinyin":"Wú Wàng","legge":"Wû Wang","name":"Innocence","alt":"The Unexpected","glyph":"䷘","lower":"zhen","upper":"qian","bits":"100111","keywords":["innocence","sincerity","spontaneity","integrity","the unexpected"],"core":"a time to act with sincerity and innocence, free of hidden motives, while accepting the unexpected","now":"Thunder rolls under heaven, and all things are set in their true nature. Innocence describes acting naturally and sincerely, without calculation or hidden motives. The text promises supreme success to those who stay correct, but warns that anyone who is not as they should be will meet misfortune. Unexpected events may happen — some good, some not. The best response is to remain genuine, not to scheme. Act because it is right, not because of what you hope to gain.","dir":"The situation may be moving toward a time when sincerity and spontaneity matter, and unexpected events test whether your motives are clear.","do":["Act sincerely and honestly","Respond naturally to what happens","Do the right thing without calculating rewards"],"avoid":["Manipulation and hidden motives","Rash actions based on wishful thinking"],"love":"Be genuine and spontaneous; do not play games. Honest feeling is your strength.","work":"Do good work for its own sake. Avoid schemes or shortcuts.","self":"Reconnect with your natural, unguarded self.","jung":"Innocence may suggest acting from the Self rather than the calculating ego. It can also point to the role of chance and the unexpected, the area where Jung located synchronicity.","example":"Helping someone without expecting thanks, or responding honestly to an unexpected turn of events.","judgment":"Wû Wang indicates great progress and success, while there will be advantage in being firm and correct. If (its subject and his action) be not correct, he will fall into errors, and it will not be advantageous for him to move in any direction.","image":"The thunder rolls all under the sky, and to (every)thing there is given (its nature), free from all insincerity. The ancient kings, in accordance with this, (made their regulations) in complete accordance with the seasons, thereby nourishing all things.","lines":[{"legge":"The first NINE, undivided, shows its subject free from all insincerity. His advance will be accompanied with good fortune.","plain":"Acting from innocence, with no hidden motive. When your intentions are simple and sincere, moving forward brings good fortune."},{"legge":"The second SIX, divided, shows one who reaps without having ploughed (that he might reap), and gathers the produce of his third year's fields without having cultivated them the first year for that end. To such a one there will be advantage in whatever direction he may move.","plain":"Ploughing without counting on the harvest, clearing land without calculating its future value. Do the work for its own sake rather than for the reward, and progress follows."},{"legge":"The third SIX, divided, shows calamity happening to one who is free from insincerity;--as in the case of an ox that has been tied up. A passer by finds it (and carries it off), while the people in the neighbourhood have the calamity (of being accused and. apprehended).","plain":"Undeserved misfortune: a passer-by takes the tethered ox, and the villagers are blamed. Sometimes trouble falls on you without any fault of yours. Keep your integrity and do not take it personally."},{"legge":"The fourth NINE, undivided, shows (a case) in which, if its subject can remain firm and correct, there will be no error.","plain":"Remain firm and true to yourself. If you can keep to what is right, no mistake will be made."},{"legge":"The fifth NINE, undivided, shows one who is free from insincerity, and yet has fallen ill. Let him not use medicine, and he will have occasion for joy (in his recovery).","plain":"An illness you did not cause. Do not rush to medicine or drastic remedies; this kind of trouble often clears up by itself. Avoid overreacting."},{"legge":"The topmost NINE, undivided, shows its subject free from insincerity, yet sure to fall into error, if he take action. (His action) will not be advantageous in any way.","plain":"Acting now, even with innocent motives, will go wrong. The timing is not right. Wait rather than moving forward."}]},{"n":26,"zh":"大畜","pinyin":"Dà Xù","legge":"Tâ Khû","name":"The Taming Power of the Great","alt":"Great Accumulation","glyph":"䷙","lower":"qian","upper":"gen","bits":"111001","keywords":["accumulation","restraint","learning","discipline","strength held in reserve"],"core":"a time of great accumulation, when restraint and learning build strength that will later be released","now":"Heaven within the mountain: great creative power is held, stored and nourished. This hexagram describes building up resources, knowledge and character through restraint and daily discipline. The text says it furthers you not to eat at home — that is, to take up public service — and to cross the great water. Hold your strength in check now, so that when you act, you act with great power. Study the words and deeds of the past to build your inner strength.","dir":"The situation may be moving toward a phase of accumulation and discipline, when strength is gathered and held in reserve before being used.","do":["Build up knowledge, skill and resources","Exercise self-discipline","Learn from history and experience"],"avoid":["Releasing energy prematurely","Wasting accumulated strength"],"love":"Commitment grows through patience and shared discipline. Build something lasting together.","work":"Invest in skills and preparation. A larger opportunity will come.","self":"Develop your character and inner strength through daily practice.","jung":"Great Accumulation may suggest the containment of libido or psychic energy, holding it rather than discharging it at once, so that it can transform into something new.","example":"Training for a long race, studying for a qualification, or saving to start a business.","judgment":"Under the conditions of Tâ Khû it will be advantageous to be firm and correct. (If its subject do not seek to) enjoy his revenues in his own family (without taking service at court), there will be good fortune. It will be advantageous for him to cross the great stream.","image":"(The trigram representing) a mountain, and in the midst of it that (representing) heaven, form Tâ Khû. The superior man, in accordance with this, stores largely in his memory the words and deeds of former men, to subserve the accumulation of his virtue.","lines":[{"legge":"The first NINE, undivided, shows its subject in a position of peril. It will be advantageous for him to stop his advance.","plain":"Danger is ahead. Stopping is wiser than pressing on. Strength that holds itself back now is preserved for later."},{"legge":"The second NINE, undivided, shows a carriage with the strap under it removed.","plain":"The axle strap of the cart has been removed. You are being held back and cannot move, and that is acceptable. Accept the pause without resentment."},{"legge":"The third NINE, undivided, shows its subject urging his way with good horses. It will be advantageous for him to realise the difficulty (of his course), and to be firm and correct, exercising himself daily in his charioteering and methods of defence; then there will be advantage in whatever direction he may advance.","plain":"Good horses race forward, but the path is still hard. Train daily, practise your skills and stay alert; then it is good to have a destination."},{"legge":"The fourth six, divided, shows the young bull, (and yet) having the piece of wood over his horns. There will be great good fortune.","plain":"A board fixed to the horns of a young bull. Restraining a force while it is still young and manageable prevents harm later. Great good fortune."},{"legge":"The fifth six, divided, shows the teeth of a castrated hog. There will be good fortune.","plain":"The tusks of a gelded boar. Rather than fighting aggression directly, remove its root. This kind of wise restraint brings good fortune."},{"legge":"The sixth NINE, undivided, shows its subject (as) in command of the firmament of heaven. There will be progress.","plain":"The road of heaven lies open. The time of restraint is over; accumulated strength can now move freely toward success."}]},{"n":27,"zh":"頤","pinyin":"Yí","legge":"Î","name":"Nourishment","alt":"The Corners of the Mouth","glyph":"䷚","lower":"zhen","upper":"gen","bits":"100001","keywords":["nourishment","care","self-care","speech","what you consume"],"core":"a time to examine what nourishes you and others, physically, emotionally and spiritually","now":"Thunder beneath the mountain, like the movement of the jaw. Nourishment is about what sustains life — food, words, relationships and ideas. The text advises paying attention to what a person seeks to fill their mouth with: what you nourish, and how you nourish others, reveals your character. Be careful with your words and moderate in consumption. Nourish what is best in yourself and others.","dir":"The situation may be moving toward a time when nourishment and care become central — what you feed yourself and others in body, mind and spirit.","do":["Look at what you consume — food, media, relationships","Choose words carefully","Nourish others generously and wisely"],"avoid":["Overindulgence","Envying what others have"],"love":"Care for each other's wellbeing. Kind words nourish a relationship.","work":"Look after your team's wellbeing. Invest in what truly sustains the organization.","self":"Examine your habits: what feeds you and what drains you?","jung":"Nourishment may point to the question of what feeds the psyche — which images, relationships and values sustain inner life. It can also suggest the mother archetype: care and dependence.","example":"Improving your diet, choosing healthier relationships, or caring for a sick family member.","judgment":"Î indicates that with firm correctness there will be good fortune (in what is denoted by it). We must look at what we are seeking to nourish, and by the exercise of our thoughts seek for the proper aliment.","image":"(The trigram representing) a mountain and under it that for thunder form Î. The superior man, in accordance with this, (enjoins) watchfulness over our words, and the temperate regulation of our eating and drinking.","lines":[{"legge":"The first NINE, undivided, (seems to be thus addressed), 'You leave your efficacious tortoise, and look at me till your lower jaw hangs down.' There will be evil.","plain":"You let go of your own spiritual resources, your \"magic tortoise\", and stare enviously at someone else's food. Envy and dependence weaken you. Return to what can nourish you from within."},{"legge":"The second SIX, divided, shows one looking downwards for nourishment, which is contrary to what is proper; or seeking it from the height (above), advance towards which will lead to evil.","plain":"Seeking nourishment in the wrong way: turning to those beneath you, or reaching for a high hill you have no claim on. Depending on the wrong sources leads to trouble."},{"legge":"The third SIX, divided, shows one acting contrary to the method of nourishing. However firm he may be, there will be evil. For ten years let him not take any action, (for) it will not be in any way advantageous.","plain":"Turning away from what truly nourishes. Even if this seems justified, it leads to misfortune that can last a long time. Nothing good comes from this approach."},{"legge":"The fourth SIX, divided, shows one looking downwards for (the power to) nourish. There will be good fortune. Looking with a tiger's downward unwavering glare, and with his desire that impels him to spring after spring, he will fall into no error.","plain":"Looking upward for help so you can nourish others is right. Like a tiger with a steady gaze, pursue this goal intensely and without selfishness. No blame."},{"legge":"The fifth SIX, divided, shows one acting contrary to what is regular and proper; but if he abide in firmness, there will be good fortune. He should not, (however, try to) cross the great stream.","plain":"You are not able to follow the normal path and must depend on others. Staying firm and steady is good, but do not attempt major risks now."},{"legge":"The sixth NINE, undivided, shows him from whom comes the nourishing. His position is perilous, but there will be good fortune. It will be advantageous to cross the great stream.","plain":"You are the source from which others are nourished. This is a heavy responsibility, so be aware of the danger; carried out conscientiously, it brings good fortune and it is right to undertake great things."}]},{"n":28,"zh":"大過","pinyin":"Dà Guò","legge":"Tâ Kwo","name":"Preponderance of the Great","alt":"Critical Mass","glyph":"䷛","lower":"xun","upper":"dui","bits":"011110","keywords":["excess","pressure","crisis","extraordinary measures","courage"],"core":"a time of extraordinary pressure, like a beam about to give way, that calls for decisive but careful action","now":"The lake rises above the trees: too much water. Preponderance of the Great describes a situation in which pressure is too much — the ridgepole of a house is sagging under the weight. The text says it furthers you to have somewhere to go: action is needed. Extraordinary times call for extraordinary measures, but they must be thoughtful and balanced. Do not panic, and do not freeze. Find a way to relieve the pressure.","dir":"The situation may be moving toward a critical point where pressure becomes too great and decisive but careful action will be needed.","do":["Recognize when pressure is too great","Act decisively to relieve it","Stay calm and independent in mind"],"avoid":["Ignoring warning signs","Overreacting with drastic measures"],"love":"The relationship may be under strain. Address the pressure honestly before something breaks.","work":"You may be overloaded. Delegate, restructure or seek support.","self":"You are carrying too much. Take steps to lighten the load.","jung":"Preponderance of the Great can describe a situation where the conscious attitude has become one-sided, and pressure from the unconscious builds until something must give way.","example":"Being overwhelmed by work, caring for a sick relative alone, or a business facing a crisis.","judgment":"Tâ Kwo suggests to us a beam that is weak. There will be advantage in moving (under its conditions) in any direction whatever; there will be success.","image":"(The trigram representing) trees hidden beneath that for the waters of a marsh forms Tâ Kwo. The superior man, in accordance with this, stands up alone and has no fear, and keeps retired from the world without regret.","lines":[{"legge":"The first SIX, divided, shows one placing mats of the white mâo grass under things set on the ground. There will be no error.","plain":"Laying a mat of white rushes beneath something precious. Being extremely careful at the start of an extraordinary undertaking brings no blame."},{"legge":"The second NINE, undivided, shows a decayed willow producing shoots, or an old husband in possession of his young wife. There will be advantage in every way.","plain":"A withered willow puts out new shoots, and an older man marries a young wife. Renewal is possible even late. Unconventional connections can bring fresh life."},{"legge":"The third NINE, undivided, shows a beam that is weak. There will be evil.","plain":"The ridgepole sags dangerously. Pushing ahead on your own strength alone, without help, leads to misfortune."},{"legge":"The fourth NINE, undivided, shows a beam curving upwards. There will be good fortune. If (the subject of it) looks for other (help but that of line one), there will be cause for regret.","plain":"The ridgepole is braced and holds. Good fortune, provided you do not lean on other, selfish motives. Stay focused on the real task."},{"legge":"The fifth NINE, undivided, shows a decayed willow producing flowers, or an old wife in possession of her young husband. There will be occasion neither for blame nor for praise.","plain":"A withered willow produces flowers, and an older woman takes a young husband. Something blossoms briefly but bears little fruit. It is not blameworthy, but it is not praiseworthy either."},{"legge":"The topmost SIX, divided, shows its subject with extraordinary (boldness) wading through a stream, till the water hides the crown of his head. There will be evil, but no ground for blame.","plain":"Wading into deep water until it covers your head. You may be sacrificing yourself for something that needs doing. The outcome is difficult, yet no blame attaches to the motive."}]},{"n":29,"zh":"坎","pinyin":"Kǎn","legge":"Khan","name":"The Abysmal","alt":"Water, Danger","glyph":"䷜","lower":"kan","upper":"kan","bits":"010010","keywords":["danger","repetition","persistence","sincerity","flow"],"core":"a time of repeated danger, which you pass through by staying sincere and moving steadily like flowing water","now":"Water upon water: danger repeated. The Abysmal describes a situation in which difficulty follows difficulty. The text says that if you are sincere, you have success in your heart, and whatever you do succeeds. Water teaches how to deal with danger: it flows on, filling every hollow, never losing its nature. Do not panic or freeze. Hold to your sincerity and keep moving steadily, one step at a time.","dir":"The situation may be moving toward repeated difficulties. Steadiness, sincerity and persistence will carry you through.","do":["Stay calm and sincere","Take one careful step at a time","Learn from repeated experiences"],"avoid":["Panic or giving up","Taking unnecessary risks"],"love":"Stay honest and steady through difficulties. Shared hardship can deepen trust.","work":"Navigate risk carefully. Keep a steady course and do not cut corners.","self":"You may feel caught in recurring struggles. Look for the pattern and keep your inner sincerity.","jung":"The Abysmal often symbolizes the unconscious itself, the dark water in which consciousness can drown or from which it can be renewed. It suggests facing fear rather than fleeing it.","example":"Going through a series of setbacks, coping with anxiety, or facing a difficult period with patience.","judgment":"Khan, here repeated, shows the possession of sincerity, through which the mind is. penetrating. Action (in accordance with this) will be of high value.","image":"(The representation of) water flowing on continuously forms the repeated Khan. The superior man, in accordance with this, maintains constantly the virtue (of his heart) and (the integrity of) his conduct, and practises the business of instruction.","lines":[{"legge":"The first SIX, divided, shows its subject in the double defile, and (yet) entering a cavern within it. There will be evil.","plain":"Getting used to danger until you fall into a pit within the pit. Becoming too familiar with risky situations makes you careless and leads to harm."},{"legge":"The second NINE, undivided, shows its subject in all the peril of the defile. He will, however, get a little (of the deliverance) that he seeks.","plain":"You are in danger and cannot escape entirely. Aim only for small gains now. Step by step, you can still make progress."},{"legge":"The third SIX, divided, shows its subject, whether he comes or goes ( =descends or ascends), confronted by a defile. All is peril to him and unrest. (His endeavours) will lead him into the cavern of the pit. There should be no action (in such a case).","plain":"Danger behind, danger ahead. Any move risks falling deeper. Stop and wait rather than acting rashly."},{"legge":"The fourth SIX, divided, shows its subject (at a feast), with (simply) a bottle of spirits, and a subsidiary basket of rice, while (the cups and bowls) are (only) of earthenware. He introduces his important lessons (as his ruler's) intelligence admits. There will in the end be no error.","plain":"A simple offering: a jug of wine, a bowl of rice, plain clay vessels, passed in through a window. In hard times, simplicity and sincerity are enough. No blame."},{"legge":"The fifth NINE, undivided, shows the water of the defile not yet full, (so that it might flow away); but order will (soon) be brought about. There will be no error.","plain":"The water has not overflowed the pit; it only reaches the brim. Do not try to do more than is necessary. Getting out safely is enough."},{"legge":"The topmost SIX, divided, shows its subject bound with cords of three strands or two strands, and placed in the thicket of thorns. But in three years he does not learn the course for him to pursue. There will be evil.","plain":"Bound with ropes and surrounded by thorns. You have lost your way and will need a long time to find it again. This is a serious difficulty."}]},{"n":30,"zh":"離","pinyin":"Lí","legge":"Lî","name":"The Clinging","alt":"Fire, Radiance","glyph":"䷝","lower":"li","upper":"li","bits":"101101","keywords":["clarity","light","dependence","insight","connection"],"core":"a time of clarity and brightness, which lasts when it is connected to something that sustains it","now":"Fire upon fire: brightness doubled. The Clinging describes light, clarity and awareness. Fire must cling to something in order to burn — wood, oil, a wick. Likewise, clarity depends on something to sustain it. The text promises success to firm correctness and advises caring for the cow — a symbol of docility and nourishment. Recognize what you depend on, and let your understanding be warm and steady, not frantic.","dir":"The situation may be moving toward greater clarity and insight. It will be important to recognize what you depend on and to keep your light steady.","do":["Seek clarity and understanding","Recognize what sustains you","Share insight warmly"],"avoid":["Burning out from too much intensity","Depending on unstable sources"],"love":"Bring warmth and understanding into the relationship. Clarify feelings honestly.","work":"Clarity and vision are your strengths. Communicate them clearly.","self":"Shed light on your situation. Identify what you truly depend on.","jung":"The Clinging may symbolize consciousness itself — the light of awareness that depends on its connection to the unconscious for its fuel.","example":"Gaining insight into a problem, a teacher inspiring students, or realizing how much you depend on a relationship.","judgment":"Lî indicates that, (in regard to what it denotes), it will be advantageous to be firm and correct, and that thus there will be free course and success. Let (its subject) also nourish (a docility like that of) the cow, and there will be good fortune.","image":"(The trigram for) brightness, repeated, forms Lî. The great man, in accordance with this, cultivates more and more his brilliant (virtue), and diffuses its brightness over the four quarters (of the land).","lines":[{"legge":"The first NINE, undivided, shows one ready to move with confused steps. But he treads at the same time reverently, and there will be no mistake.","plain":"Footsteps going in many directions at once at the start of the day. In the first rush of activity, stay attentive and respectful, and you will avoid mistakes."},{"legge":"The second SIX, divided, shows its subject in his place in yellow. There will be great good fortune.","plain":"A yellow light, the color of the center. Clarity combined with moderation brings great good fortune."},{"legge":"The third NINE, undivided, shows its subject in a position like that of the declining sun. Instead of playing on his instrument of earthenware, and singing to it, he utters the groans of an old man of eighty. There will be evil.","plain":"The light of the setting sun. People either sing and beat the drum or lament old age. Do not waste time on grief or forced gaiety; accept the cycles of life calmly."},{"legge":"The fourth NINE, undivided, shows the manner of its subject's coming. How abrupt it is, as with fire, with death, to be rejected (by all)!","plain":"A fire that flares up suddenly, burns out and is discarded. Abrupt intensity cannot last. Avoid acting violently or impulsively."},{"legge":"The fifth SIX, divided, shows its subject as one with tears flowing in torrents, and groaning in sorrow. There will be good fortune.","plain":"Tears flowing, sighing and grief. Genuine sorrow and humility, especially in a high position, lead to good fortune."},{"legge":"The topmost NINE, undivided, shows the king employing its subject in his punitive expeditions. Achieving admirable (merit), he breaks (only) the chiefs (of the rebels). Where his prisoners were not their associates, he does not punish. There will be no error.","plain":"The king goes out to correct wrongs. Punish only the leaders of a rebellion and spare the followers. Firm action should be fair and proportionate."}]},{"n":31,"zh":"咸","pinyin":"Xián","legge":"Hsien","name":"Influence","alt":"Attraction","glyph":"䷞","lower":"gen","upper":"dui","bits":"001110","keywords":["attraction","mutual influence","courtship","sensitivity","openness"],"core":"a time of mutual attraction and influence, when openness and humility create genuine connection","now":"A lake on top of a mountain: the mountain receives and supports the water. Influence describes mutual attraction and the power of genuine feeling. The text says it brings success, and that taking a maiden in marriage brings good fortune. Real influence comes not from pressure, but from openness, sincerity and receptivity. When you are humble and genuine, people respond naturally.","dir":"The situation may be moving toward attraction and mutual influence. Openness and sincerity will create genuine connections.","do":["Be open and receptive","Let attraction develop naturally","Influence through sincerity, not pressure"],"avoid":["Manipulation","Acting impulsively on surface attraction"],"love":"Strong attraction or emotional connection. Let it develop with openness and respect.","work":"Influence others by listening and responding sincerely.","self":"Notice what moves you deeply. Your feelings are a guide.","jung":"Influence may describe the mutual attraction of opposites — conscious and unconscious, masculine and feminine. In relationships it can reflect projection, as we see in others parts of ourselves.","example":"Falling in love, finding an inspiring mentor, or forming a close friendship.","judgment":"Hsien indicates that, (on the fulfilment of the conditions implied in it), there will be free course and success. Its advantageousness will depend on the being firm and correct, (as) in marrying a young lady. There will be good fortune.","image":"(The trigram representing) a mountain and above it that for (the waters of) a marsh form Hsien. The superior man, in accordance with this, keeps his mind free from pre-occupation, and open to receive (the influences of) others.","lines":[{"legge":"The first six, divided, shows one moving his great toes.","plain":"Feeling begins in the big toe. An impulse is stirring, but nothing has happened yet. Notice it without acting on it."},{"legge":"The second SIX, divided, shows one moving the calves of his leg. There will be evil. If he abide (quiet in his place), there will be good fortune.","plain":"Feeling moves the calves. Wanting to rush forward before you have thought things through leads to trouble. Waiting brings good fortune."},{"legge":"The third NINE, undivided, shows one moving his thighs, and keeping close hold of those whom he follows. Going forward (in this way) will cause regret.","plain":"Feeling reaches the thighs, and you follow others or your impulses blindly. Moving on this basis will bring regret. Hold to your own judgement."},{"legge":"The fourth NINE, undivided, shows that firm correctness whi.ch will lead to good fortune, and prevent all occasion for repentance. If its subject be unsettled in his movements, (only) his friends will follow his purpose.","plain":"Firm correctness brings good fortune and regret disappears. If your mind is restless and calculating, only close friends will follow you. Influence that comes from the heart spreads further."},{"legge":"The fifth NINE, undivided, shows one moving the flesh along the spine above the heart. There will be no occasion for repentance.","plain":"Feeling in the muscles of the back, the part least moved by emotion. Your resolve is firm, but you remain largely unmoved. There is no regret, though little influence either."},{"legge":"The sixth six, divided, shows one moving his jaws and tongue.","plain":"Feeling reaches the jaws, cheeks and tongue. It turns into talk. Words alone do not move others; sincere action does."}]},{"n":32,"zh":"恆","pinyin":"Héng","legge":"Hăng","name":"Duration","alt":"Perseverance","glyph":"䷟","lower":"xun","upper":"zhen","bits":"011100","keywords":["endurance","consistency","commitment","stability","long-term thinking"],"core":"a time of duration and perseverance, when lasting success comes from steady commitment that still adapts","now":"Thunder and wind work together, enduring forces of nature. Duration describes perseverance and lasting commitment. The text says it brings success and no blame. Duration is not rigidity; like the seasons, it is constant movement within a stable pattern. Keep your commitments, stay true to your direction, and adapt your methods to changing circumstances.","dir":"The situation may be moving toward a phase where consistency and long-term commitment become important.","do":["Keep your commitments","Build lasting habits","Adapt your methods while keeping your direction"],"avoid":["Restlessness","Rigidity","Demanding too much too soon"],"love":"Long-term commitment and reliability are the foundation of trust.","work":"Steady effort over time produces the strongest results.","self":"Persist in what matters. Small daily actions build lasting change.","jung":"Duration may suggest the stability of identity over time — the continuity of the Self beneath changing moods and circumstances.","example":"A long marriage, a career built over decades, or a lifelong practice.","judgment":"Hăng indicates successful progress and no error (in what it denotes). But the advantage will come from being firm and correct; and movement in any direction whatever will be advantageous.","image":"(The trigram representing) thunder and that for wind form Hăng. The superior man, in accordance with this, stands firm, and does not change his method (of operation).","lines":[{"legge":"The first SIX, divided, shows its subject deeply (desirous) of long continuance. Even with firm correctness there will be evil; there will be no advantage in any way.","plain":"Insisting on permanence too early and too deeply. Demanding lasting results from the start leads to trouble. Let durability grow over time."},{"legge":"The second NINE, undivided, shows all occasion for repentance disappearing.","plain":"Regret disappears. By staying in the middle path, you avoid excess and find steady footing."},{"legge":"The third NINE, undivided, shows one who does not continuously maintain his virtue. There are those who will impute this to him as a disgrace. However firm he may be, there will be ground for regret.","plain":"Not keeping your character consistent. Changing your values with every situation brings disgrace and regret."},{"legge":"The fourth NINE, undivided, shows a field where there is no game.","plain":"Hunting in a field where there is no game. Persistence in the wrong place brings nothing. Check whether you are aiming in the right direction."},{"legge":"The fifth SIX, divided, shows its subject continuously maintaining the virtue indicated by it. In a wife this will be fortunate; in a husband, evil.","plain":"Constancy in following, which is right for someone in a supporting role. But someone who must lead needs to act on their own judgement, not mere compliance. Know which role you hold."},{"legge":"The topmost SIX, divided, shows its subject exciting himself to long continuance. There will be evil.","plain":"Restlessness as a permanent state. Constantly stirring things up without settli
