hock leaves you stuck in the mud. Your energy is bogged down; you cannot respond well right now."},{"legge":"The fifth SIX, divided, shows its subject going and coming amidst the startling movements (of the time), and always in peril; but perhaps he will not incur loss, and find business (which he can accomplish).","plain":"Shocks come and go, and danger surrounds you. Do not lose your center; there is still work to be done."},{"legge":"The topmost SIX, divided, shows its subject, amidst the startling movements (of the time), in breathless dismay and looking round him with trembling apprehension. If he take action, there will be evil. If, while the startling movements have not reached his own person and his neighbourhood, (he were to take precautions), there would be no error, though his relatives might (still) speak against him.","plain":"Shock causes panic and wild looks. Going forward now brings misfortune. If the shock has not yet hit you but your neighbour, you can avoid harm. There may be gossip."}]},{"n":52,"zh":"艮","pinyin":"Gèn","legge":"Kăn","name":"Keeping Still","alt":"Mountain","glyph":"䷳","lower":"gen","upper":"gen","bits":"001001","keywords":["stillness","rest","meditation","boundaries","timing"],"core":"a time of stillness, when calming the mind and stopping at the right moment brings clarity","now":"Mountain upon mountain: stillness doubled. Keeping Still describes the art of rest and stopping. The text describes keeping the back still so that one no longer feels the body, and walking in the courtyard without noticing people — inner calm so deep that outer things no longer disturb. The Image advises the wise person not to let thoughts go beyond their situation. Stop when it is time to stop, move when it is time to move, and let the mind settle.","dir":"The situation may be moving toward a time of stillness. Calm reflection and knowing when to stop will matter more than action.","do":["Pause and let your thoughts settle","Know when to stop","Practise meditation or quiet reflection"],"avoid":["Restlessness","Overthinking beyond what you can affect"],"love":"Give each other space and quiet. Stillness can bring clarity.","work":"Pause before big decisions. Rest prevents burnout.","self":"A perfect time for meditation, retreat or rest.","jung":"Keeping Still resembles meditation and the quieting of the ego so that the deeper Self can be perceived. Stillness allows unconscious contents to surface without being disturbed.","example":"Taking a retreat, pausing a project to reflect, or learning to calm an anxious mind.","judgment":"When one's resting is like that of the back, and he loses all consciousness of self; when he walks in his courtyard, and does not see any (of the persons) in it,--there will be no error.","image":"(Two trigrams representing) a mountain, one over the other, form Kăn. The superior man, in 0 accordance with this, does not go in his thoughts beyond the (duties of the) position in which he is.","lines":[{"legge":"The first SIX, divided, shows its subject keeping his toes at rest. There will be no error; but it will be advantageous for him to be persistently firm and correct.","plain":"Keeping the toes still. Stopping before you even start prevents mistakes. Lasting firmness is beneficial."},{"legge":"The second SIX, divided, shows its subject keeping the calves of his legs at rest. He cannot help (the subject of the line above) whom he follows, and is dissatisfied in his mind.","plain":"Keeping the calves still. You cannot stop the person you follow, and your heart is not glad. You may have to go along with something you disagree with."},{"legge":"The third NINE, undivided, shows its subject keeping his loins at rest, and separating the ribs (from the body below). The situation is perilous, and the heart glows with suppressed excitement.","plain":"Keeping the hips still and stiffening the back. Forcing stillness creates tension and danger. True calm cannot be forced."},{"legge":"The fourth SIX, divided, shows its subject keeping his trunk at rest. There will be no error.","plain":"Keeping the trunk still. You have calmed yourself, even if you cannot yet calm others. No blame."},{"legge":"The fifth SIX, divided, shows its subject keeping his jawbones at rest, so that his words are (all) orderly. Occasion for repentance will disappear.","plain":"Keeping the jaws still. Speaking carefully and in order makes regret disappear."},{"legge":"The sixth NINE, undivided, shows its subject devotedly maintaining his restfulness. There will be good fortune.","plain":"Noble-hearted stillness. A deep, settled calm brings good fortune."}]},{"n":53,"zh":"漸","pinyin":"Jiàn","legge":"Kien","name":"Development","alt":"Gradual Progress","glyph":"䷴","lower":"gen","upper":"xun","bits":"001011","keywords":["gradual progress","patience","commitment","stages","maturation"],"core":"a time of gradual development, when lasting results come step by step, like a tree slowly growing on a mountain","now":"A tree on a mountain grows slowly and stands firm. Development describes progress that happens in stages. The text uses the image of a maiden being given in marriage according to the proper customs — everything in its proper order. Rushing would undermine the result. Steady, patient progress builds something durable. The wild goose in the line texts flies step by step from the shore to the heights.","dir":"The situation may be moving toward slow, steady development. Patience and proper sequence will lead to lasting results.","do":["Proceed step by step","Respect the proper order of things","Build stable foundations"],"avoid":["Shortcuts","Impatience"],"love":"Let the relationship develop naturally. Commitment grows through patience and respect.","work":"Progress through careful stages. Lasting success takes time.","self":"Personal growth happens gradually. Trust the process.","jung":"Development describes the gradual process of individuation — the slow, organic growth of personality toward wholeness.","example":"Building a career over years, a relationship deepening slowly, or learning a skill step by step.","judgment":"Kien suggests to us the marriage of a young lady, and the good fortune (attending it). There will be advantage in being firm and correct.","image":"(The trigram representing) a mountain and above it that for a tree form Kien. The superior man, in accordance with this, attains to and maintains his extraordinary virtue, and makes the manners of the people good.","lines":[{"legge":"The first SIX, divided, shows the wild geese gradually approaching the shore. A young officer (in similar circumstances) will be in a position of danger, and be spoken against; but there will be no error.","plain":"The wild goose gradually approaches the shore. A young person starting out may feel exposed and be criticised, but there is no real fault in moving forward carefully."},{"legge":"The second SIX, divided, shows the geese gradually approaching the large rocks, where they eat and drink joyfully and at ease. There will be good fortune.","plain":"The goose reaches a large rock. You have found a secure place; enjoy food and companionship in peace. Good fortune."},{"legge":"The third NINE, undivided, shows them gradually advanced to the dry plains. (It suggests also the idea of) a husband who goes on an expedition from which he does not return, and of a wife who is pregnant, but will not nourish her child. There will be evil. (The case symbolised) might be advantageous in resisting plunderers.","plain":"The goose flies to the dry plateau, the wrong place for it. Pushing on too far leads to separation and disappointment. Instead, protect what you have against harm."},{"legge":"The fourth SIX, divided, shows the geese gradually advanced to the trees. They may light on the flat branches. There will be no error.","plain":"The goose lands in a tree, where it cannot easily stand. It may find a flat branch. Look for a safe, temporary position; there is no blame."},{"legge":"The fifth NINE, undivided, shows the geese gradually advanced to the high mound. (It suggests the idea of) a wife who for three years does not become pregnant; but in the end the natural issue cannot be prevented. There will be good fortune.","plain":"The goose reaches a high hill. Separation or delay may last a long time, but in the end nothing can prevent the good outcome. Good fortune."},{"legge":"The sixth NINE, undivided, shows the geese gradually advanced to the large heights (beyond). Their feathers can be used as ornaments. There will be good fortune.","plain":"The goose rises to the heights, and its feathers can be used for sacred dances. A life lived step by step becomes an example to others. Good fortune."}]},{"n":54,"zh":"歸妹","pinyin":"Guī Mèi","legge":"Kwei Mei","name":"The Marrying Maiden","alt":"Subordinate","glyph":"䷵","lower":"dui","upper":"zhen","bits":"110100","keywords":["subordinate position","commitment","roles","limitations","timing"],"core":"a situation in which you enter a relationship or role from a subordinate position, where tact and awareness of limits are essential","now":"Thunder over the lake: the young woman follows the older man. The Marrying Maiden describes entering a relationship or situation from a subordinate position — as a secondary wife in ancient China. The traditional text warns that aggressive action brings misfortune and nothing furthers. This is not a time to demand or push. Understand your position, work within it with dignity, and keep the long term in mind. The Image advises understanding what will last by knowing what causes ruin.","dir":"The situation may be moving toward a role where you have limited power. Patience, tact and dignity will be essential.","do":["Understand your position and its limits","Act with tact and dignity","Think about the long term"],"avoid":["Demanding or forcing","Entering commitments for the wrong reasons"],"love":"Look honestly at the balance of power in the relationship. Commitments need to be fair to last.","work":"You may be in a junior or dependent position. Work with dignity and make yourself valuable.","self":"Notice where you feel subordinate or dependent. Accept limits while keeping self-respect.","jung":"The Marrying Maiden may describe a relationship in which one person carries a projection that does not truly fit them. Psychological maturity requires recognizing the real person behind the projection.","example":"Starting in a junior role, joining a family as an in-law, or accepting a partnership on unequal terms.","judgment":"Kwei Mei indicates that (under the conditions which it denotes) action will be evil, and in no wise advantageous.","image":"(The trigram representing the waters of) a marsh and over it that for thunder form Kwei Mei. The superior man, in accordance with this, having regard to the far-distant end, knows the mischief (that may be done at the beginning).","lines":[{"legge":"The first NINE, undivided, shows the younger sister married off in a position ancillary to the real wife. (It suggests the idea of) a person lame on one leg who yet manages to tramp along. Going forward will be fortunate.","plain":"Married as a junior wife: like a lame person who can still walk. A subordinate role can still be fulfilled with dignity, and moving forward brings good fortune."},{"legge":"The second NINE, undivided, shows her blind of one eye, and yet able to see. There will be advantage in her maintaining the firm correctness of a solitary widow.","plain":"Like a one-eyed person who can still see. Even in a disappointing situation, stay loyal to your own inner standards, as a solitary person keeps faith."},{"legge":"The third SIX, divided, shows the younger sister who was to be married off in a mean position. She returns and accepts an ancillary position.","plain":"Expecting a high position, she must accept a lower one. Insisting on status you do not have leads nowhere; accept the real situation and rebuild from there."},{"legge":"The fourth NINE, undivided, shows the younger sister who is to be married off protracting the time. She may be late in being married, but the time will come.","plain":"The marriage is delayed past its expected time. Waiting for the right partner or moment is wise; it will come later."},{"legge":"The fifth SIX, divided, reminds us of the marrying of the younger sister of (king) Tî-yî, when the sleeves of her the princess were not equal to those of the (still) younger sister who accompanied her in an inferior capacity. (The case suggests the thought of) the moon almost full. There will be good fortune.","plain":"The king's daughter wears plainer clothes than her bridesmaid. Modesty and inner worth matter more than outward display. Like the moon nearly full, she shines without needing to show off. Good fortune."},{"legge":"The sixth SIX, divided, shows the young lady bearing the basket, but without anything in it, and the gentleman slaughtering the sheep, but without blood flowing from it. There will be no advantage in any way.","plain":"A woman holds a basket with no fruit, and a man sacrifices a sheep without blood. Going through the motions of a commitment without real substance brings no benefit."}]},{"n":55,"zh":"豐","pinyin":"Fēng","legge":"Făng","name":"Abundance","alt":"Fullness","glyph":"䷶","lower":"li","upper":"zhen","bits":"101100","keywords":["abundance","peak","clarity","action","impermanence"],"core":"a peak of abundance and achievement, which should be used fully and wisely because it will not last forever","now":"Thunder and lightning arrive together: a moment of brilliant fullness. Abundance describes a peak — of success, energy or influence. The text says the king attains abundance and should not be sad; be like the sun at midday. Enjoy and use this fullness, but remember that the sun at its height begins to decline. The Image advises deciding lawsuits and carrying out punishments — that is, making clear, decisive judgments while you have the clarity to do so.","dir":"The situation may be moving toward a peak of abundance. Use it wisely and decisively, knowing it will not last.","do":["Make the most of this peak","Act decisively and clearly","Share abundance"],"avoid":["Worrying about decline","Wasting the moment"],"love":"Celebrate what you have together. Make decisions you have been postponing.","work":"A peak period. Complete important tasks and make clear decisions.","self":"Enjoy your energy and clarity, but prepare for quieter times.","jung":"Abundance may describe a peak of conscious energy and clarity — a moment of fullness that carries the seeds of its own decline.","example":"A successful season in business, a celebration, or a peak in personal achievement.","judgment":"Făng intimates progress and development. When a king has reached the point (which the name denotes) there is no occasion to be anxious (through fear of a change). Let him be as the sun at noon.","image":"(The trigrams representing) thunder and lightning combine to form Făng. The superior man, in accordance with this, decides cases of litigation, and apportions punishments with exactness.","lines":[{"legge":"The first NINE, undivided, shows its subject meeting with his mate. Though they are both of the same character, there will be no error. Advance will call forth approval.","plain":"You meet a partner who matches you. Even if you are alike, working together for a while is not a mistake, and moving forward wins recognition."},{"legge":"The second SIX, divided, shows its subject surrounded by screens so large and thick that at midday he can see from them the constellation of the Bushel. If he go (and try to enlighten his ruler who is thus emblemed), he will make himself to be viewed with suspicion and dislike. Let him cherish his feeling of sincere devotion that he may thereby move (his ruler's mind), and there will be good fortune.","plain":"A curtain so thick that stars are visible at noon. Your clarity is hidden by those above you. Trying to force your views would create suspicion; sincere patience will eventually win trust."},{"legge":"The third NINE, undivided, shows its subject with an (additional) screen of a large and thick banner, through which at midday he can see (the small) Mei star. (In the darkness) he breaks his right arm; but there will be no error.","plain":"The darkness thickens, and you break your right arm. You may be unable to act for now. That is not your fault."},{"legge":"The fourth NINE, undivided, shows its subject in a tent so large and thick that at midday he can see from it the constellation of the Bushel. But he meets with the subject of the (first) line, undivided like himself. There will be good fortune.","plain":"The curtain is thick and the light is obscured, but you meet a like-minded ally. Working together brings good fortune."},{"legge":"The fifth SIX, divided, shows its subject bringing around him the men of brilliant ability. There will be occasion for congratulation and praise. There will be good fortune.","plain":"You bring talented people around you. Recognition and good fortune follow from gathering bright minds."},{"legge":"The topmost SIX, divided, shows its subject with his house made large, but only serving as a screen to his household. When he looks at his door, it is still, and there is nobody about it. For three years no one is to be seen. There will be evil.","plain":"A great house that shuts out the world. Looking through the door, you see no one. Isolation at the height of abundance leads to long loneliness and misfortune."}]},{"n":56,"zh":"旅","pinyin":"Lǚ","legge":"Lü","name":"The Wanderer","alt":"The Traveller","glyph":"䷷","lower":"gen","upper":"li","bits":"001101","keywords":["travel","transition","caution","adaptability","humility"],"core":"a time of travel or transition, when caution, modesty and adaptability keep you safe in unfamiliar places","now":"Fire on the mountain: it burns briefly and moves on. The Wanderer describes being a stranger — travelling, in transition or in an unfamiliar situation. The text says success comes in small matters; firmness and correctness bring good fortune to the traveller. As a stranger, you have no established position. Be cautious, modest and adaptable. The Image advises the wise person to be clear-minded and careful in imposing penalties, and not to drag out lawsuits.","dir":"The situation may be moving toward a period of transition or unfamiliar territory. Caution, modesty and adaptability will help.","do":["Be modest and polite","Adapt to unfamiliar situations","Keep your affairs simple"],"avoid":["Arrogance","Getting entangled in disputes"],"love":"A relationship may feel temporary or uncertain. Be respectful and honest about where you stand.","work":"You may be new or temporary in a role. Learn the culture and avoid conflicts.","self":"You may feel like a stranger to yourself. Explore with curiosity.","jung":"The Wanderer may describe the psychological state of being between identities — no longer who you were and not yet who you will be. The journey itself is transformative.","example":"Moving to a new country, starting a temporary job, or travelling alone.","judgment":"Lü intimates that (in the condition which it denotes) there may be some little attainment and progress. If the stranger or traveller be firm and correct as he ought to be, there will be good fortune.","image":"(The trigram representing) a mountain and above it that for fire form Lü. The superior man, in accordance with this, exerts his wisdom and caution in the use of punishments and not allowing litigations to continue.","lines":[{"legge":"The first SIX, divided, shows the stranger mean and meanly occupied. It is thus that he brings on himself (further) calamity.","plain":"A traveller who occupies himself with petty matters brings trouble on himself. Keep your dignity even when you are a stranger."},{"legge":"The second SIX, divided, shows the stranger, occupying his lodging-house, carrying with him his means of livelihood, and provided with good and trusty servants.","plain":"The traveller finds lodging, keeps his resources with him and wins a faithful helper. Prudence and modesty make a stranger safe."},{"legge":"The third NINE, undivided, shows the stranger, burning his lodging-house, and having lost his servants. However firm and correct he (try to) be, he will be in peril.","plain":"The traveller's lodging burns, and he loses his helper's loyalty through arrogance. Pride in an unfamiliar place is dangerous."},{"legge":"The fourth NINE, undivided, shows the traveller in a resting-place, having (also) the means of livelihood and the axe, (but still saying), 'I am not at ease in my mind.'","plain":"The traveller has found shelter, resources and protection, but his heart is not at ease. Outward security does not end the feeling of being a stranger."},{"legge":"The fifth SIX, divided, shows its subject shooting a pheasant. He will lose his arrow, but in the end he will obtain praise and a (high) charge.","plain":"Shooting a pheasant and losing an arrow. A small sacrifice opens the door to recognition and a respected role."},{"legge":"The sixth NINE, undivided, suggests the idea of a bird burning its nest. The stranger, (thus represented), first laughs and then cries out. He has lost his ox(-like docility) too readily and easily. There will be evil.","plain":"A bird's nest burns. The traveller laughs at first, then weeps, having lost his patience and gentleness too easily. Carelessness and arrogance bring misfortune."}]},{"n":57,"zh":"巽","pinyin":"Xùn","legge":"Sun","name":"The Gentle","alt":"Wind, Penetrating","glyph":"䷸","lower":"xun","upper":"xun","bits":"011011","keywords":["gentleness","persistence","influence","clarity of purpose","adaptability"],"core":"a time when gentle, persistent influence achieves more than force, like wind that penetrates everywhere","now":"Wind following wind: gentle penetration. The Gentle describes influence that works slowly and persistently, like wind that shapes trees or water that wears down stone. The text says small successes come, that it is good to have somewhere to go and to see the great man. The Image advises the wise person to repeat their instructions and carry out their affairs — clear, repeated communication works best. Be gentle, but know exactly what you want.","dir":"The situation may be moving toward a time when gentle, persistent influence is the most effective approach.","do":["Influence gently and persistently","Communicate clearly and repeatedly","Have a clear goal"],"avoid":["Indecision","Using force"],"love":"Gentle words and persistence can heal tensions. Be clear about what you want.","work":"Persuade through repeated, clear communication. Small steps will add up.","self":"Change your habits gently and consistently.","jung":"The Gentle may describe the subtle influence of the unconscious, which works quietly and persistently on the conscious mind, often through intuition and recurring images.","example":"Gradually persuading a team, influencing a child's habits, or slowly changing a long-standing pattern.","judgment":"Sun intimates that (under the conditions which it denotes) there will be some little attainment and progress. There will be advantage in movement onward in whatever direction. It will be advantageous (also) to see the great man.","image":"(Two trigrams representing) wind, following each other, form Sun. The superior man, in accordance with this, reiterates his orders, and secures the practice of his affairs.","lines":[{"legge":"The first SIX, divided, shows its subject (now) advancing, (now) receding. It would be advantageous for him to have the firm correctness of a brave soldier.","plain":"Moving forward and back in indecision. Doubt keeps you from acting. Adopt the firm discipline of a soldier: decide and commit."},{"legge":"The second NINE, undivided, shows the representative of Sun beneath a couch, and employing diviners and exorcists in a way bordering on confusion. There will be good fortune and no error.","plain":"Penetration under the bed. Hidden influences need to be brought to light, and it may take the help of specialists or even ritual. With persistence, good fortune and no blame."},{"legge":"The third NINE, undivided, shows its subject penetrating (only) by violent and repeated efforts. There will be occasion for regret.","plain":"Repeated penetration. Constantly changing your mind, or forcing gentleness too often, leads to humiliation."},{"legge":"The fourth SIX, divided, shows all occasion for repentance (in its subject) passed away. He takes game for its threefold use in his hunting.","plain":"Remorse disappears. During the hunt, three kinds of game are caught. Gentle, well-directed effort brings rich results."},{"legge":"The fifth NINE, undivided, shows that with firm correctness there will be good fortune (to its subject). All occasion for repentance will disappear, and all his movements will be advantageous. There may have been no (good) beginning, but there will be a (good) end. Three days before making any changes, (let him give notice of them); and three days after, (let him reconsider them). There will (thus) be good fortune.","plain":"Firmness brings good fortune, and remorse disappears. Nothing is without benefit. Without a good beginning there can still be a good end: consider carefully before and after a change."},{"legge":"The sixth NINE, undivided, shows the representative of penetration beneath a couch, and having lost the axe with which he executed his decisions. However firm and correct he may (try to) be, there will be evil.","plain":"Penetration under the bed, losing your property and your axe. Going too far in gentleness or submission costs you your means of defense. Persistence here brings misfortune."}]},{"n":58,"zh":"兌","pinyin":"Duì","legge":"Tui","name":"The Joyous","alt":"Lake, Joy","glyph":"䷹","lower":"dui","upper":"dui","bits":"110110","keywords":["joy","communication","pleasure","friendship","sincerity"],"core":"a time of joy and open communication, when sincere pleasure shared with others brings success","now":"Two lakes connected: water flows between them. The Joyous describes joy, pleasure and open communication. The text promises success to those who are firm and correct. True joy comes from within and is shared with others; it does not depend on outside excitement. The Image advises the wise person to join with friends for discussion and practice. Enjoy and share, but make sure the joy is sincere and not based on flattery or indulgence.","dir":"The situation may be moving toward joy and open communication. Sincere sharing with others will strengthen bonds.","do":["Share joy and appreciation","Communicate openly and kindly","Learn together with friends"],"avoid":["Flattery or empty pleasure","Indulgence that weakens you"],"love":"Joy, laughter and honest conversation deepen love now.","work":"A positive atmosphere helps teamwork. Encourage open discussion.","self":"Notice what genuinely brings you joy.","jung":"The Joyous may describe the life-affirming energy of eros and connection. Psychologically, joy shared with others can integrate the personality, while compulsive pleasure-seeking can mask emptiness.","example":"Celebrating with friends, a lively discussion, or the joy of learning something new together.","judgment":"Tui intimates that (under its conditions) there will be progress and attainment. (But) it will be advantageous to be firm and correct.","image":"(Two symbols representing) the waters of a marsh, one over the other, form Tui. The superior man, in accordance with this, (encourages) the conversation of friends and (the stimulus of) their (common) practice.","lines":[{"legge":"The first NINE, undivided, shows the pleasure of (inward) harmony. There will be good fortune.","plain":"Joy that comes from inner harmony, not from outside things. Contentment of this kind brings good fortune."},{"legge":"The second NINE, undivided, shows the pleasure arising from (inward) sincerity. There will be good fortune. Occasion for repentance will disappear.","plain":"Joy rooted in sincerity and trust. Good fortune; regret disappears."},{"legge":"The third SIX, divided, shows its subject bringing round himself whatever can give pleasure. There will be evil.","plain":"Joy that comes from chasing pleasures from outside yourself. Seeking constant stimulation leaves you empty and leads to trouble."},{"legge":"The fourth NINE, undivided, shows its subject deliberating about what to seek his pleasure in, and not at rest. He borders on what would be injurious, but there will be cause for joy.","plain":"You are weighing which kind of pleasure to choose and are not at peace. If you turn away from what harms you, real joy will come."},{"legge":"The fifth NINE, undivided, shows its subject trusting in one who would injure him. The situation is perilous.","plain":"Trusting someone or something that undermines you. Even pleasant influences can be harmful. Be careful."},{"legge":"The topmost SIX, divided, shows the pleasure of its subject in leading and attracting others.","plain":"Being drawn along by the pull of pleasure, without direction of your own. Notice where you are being led."}]},{"n":59,"zh":"渙","pinyin":"Huàn","legge":"Hwan","name":"Dispersion","alt":"Dissolution","glyph":"䷺","lower":"kan","upper":"xun","bits":"010011","keywords":["dissolving barriers","reunion","release","spirituality","unity"],"core":"a time to dissolve rigid barriers and scattered energies, bringing people back together around a shared purpose","now":"Wind blows over the water and disperses it. Dispersion describes the dissolving of what is rigid or blocked — tensions, egotism or separation. The text says the king approaches his temple and that crossing the great water is beneficial. Dissolving barriers can unite people again around something larger. The Image describes ancient kings sacrificing to the Lord and building temples. Spiritual or shared purpose can overcome division.","dir":"The situation may be moving toward a time when rigid barriers dissolve and people can unite around shared purpose.","do":["Dissolve barriers and misunderstandings","Unite people around a shared purpose","Let go of selfishness"],"avoid":["Rigidity","Isolation"],"love":"Let go of pride and resentment. Reconnect through shared values.","work":"Break down silos and unite the team around a common purpose.","self":"Release rigid attitudes or emotional blockages.","jung":"Dispersion may describe the dissolving of rigid ego-boundaries. It can open space for new connections with the unconscious and with others.","example":"Resolving a family feud, breaking down barriers between departments, or letting go of an old grudge.","judgment":"Hwân intimates that (under its conditions) there will be progress and success. The king goes to his ancestral temple; and it will be advantageous to cross the great stream. It will be advantageous to be firm and correct.","image":"(The trigram representing) water and that for wind moving above the water form Hwân. The ancient kings, in accordance with this, presented offerings to God and established the ancestral temple.","lines":[{"legge":"The first SIX, divided, shows its subject engaged in rescuing (from the impending evil) and having (the assistance of) a strong horse. There will be good fortune.","plain":"Bringing help with the strength of a horse. Acting quickly at the first sign of division prevents things from scattering. Good fortune."},{"legge":"The second NINE, undivided, shows its subject, amid the dispersion, hurrying to his contrivance (for security). All occasion for repentance will disappear.","plain":"As things scatter, you hurry to what can support you. Finding stable ground makes regret disappear."},{"legge":"The third SIX, divided, shows its subject discarding any regard to his own person. There will be no occasion for repentance.","plain":"Letting go of concern for yourself. Dissolving selfishness frees you to serve something larger. No regret."},{"legge":"The fourth SIX, divided, shows its subject scattering the (different) parties (in the state); which leads to great good fortune. From the dispersion (he collects again good men standing out, a crowd) like a mound, which is what ordinary men would not have thought of.","plain":"Breaking up narrow factions so that a larger unity can form. This brings great good fortune; ordinary people could not imagine such a gathering."},{"legge":"The fifth NINE, undivided, shows its subject amidst the dispersion issuing his great announcements as the perspiration (flows from his body). He scatters abroad (also) the accumulations in the royal granaries. There will be no error.","plain":"In the midst of dispersion, a leader speaks with great conviction, like sweat pouring out, and shares resources widely. Generosity and clear communication bring everyone together. No blame."},{"legge":"The topmost NINE, undivided, shows its subject disposing of (what may be called) its bloody wounds, and going and separating himself from its anxious fears. There will be no error.","plain":"Removing yourself and others from danger and harm. Keeping your distance from what threatens bloodshed is no mistake."}]},{"n":60,"zh":"節","pinyin":"Jié","legge":"Kieh","name":"Limitation","alt":"Boundaries","glyph":"䷻","lower":"dui","upper":"kan","bits":"110010","keywords":["limits","boundaries","moderation","structure","discipline"],"core":"a time to set wise limits and boundaries, which give structure and freedom when they are not too harsh","now":"Water above the lake: a lake can hold only so much. Limitation describes the boundaries that give life structure. The text says limitation brings success, but harsh limitation should not be persisted in. Healthy limits — on spending, time, energy, commitments — create freedom. The Image advises creating number and measure and examining the nature of virtue and correct conduct. Limits should be wise and bearable.","dir":"The situation may be moving toward a need for limits. Sensible boundaries will help, but avoid being too harsh.","do":["Set clear, reasonable limits","Use resources wisely","Know your capacity"],"avoid":["Excessive strictness","Ignoring limits"],"love":"Healthy boundaries make the relationship stronger. Respect each other's limits.","work":"Set budgets, schedules and boundaries. Do not overextend.","self":"Know your limits and respect them.","jung":"Limitation may describe the necessary boundaries of the ego, which allow it to function without being flooded by unconscious contents.","example":"Creating a budget, setting working hours, or establishing boundaries with demanding people.","judgment":"Kieh intimates that (under its conditions) there will be progress and attainment. (But) if the regulations (which it prescribes) be severe and difficult, they cannot be permanent.","image":"(The trigram representing) a lake, and above it that for water, form Kieh. The superior man, in accordance with this, constructs his (methods of) numbering and measurement, and discusses (points of) virtue and conduct.","lines":[{"legge":"The first NINE, undivided, shows its subject not quitting the courtyard outside his door. There will be no error.","plain":"Not going out beyond your own courtyard. Knowing when to stay quiet and stay put is no mistake."},{"legge":"The second NINE, undivided, shows its subject not quitting the courtyard inside his gate. There will be evil.","plain":"Not going beyond your own gate when the time to act has come. Holding back too long brings misfortune."},{"legge":". The third SIX, divided, shows its subject with no appearance of observing the (proper) regulations, in which case we shall see him lamenting. But there will be no one to blame (but himself).","plain":"Ignoring all limits brings regret and lament. There is no one to blame but yourself."},{"legge":"The fourth SIX, divided, shows its subject quietly and naturally (attentive to all) regulations. There will be progress and success.","plain":"Accepting limits peacefully and naturally. Calm self-discipline brings success."},{"legge":"The fifth NINE, undivided, shows its subject sweetly and acceptably enacting his regulations. There will be good fortune. The onward progress with them will afford ground for admiration.","plain":"Limits that are pleasant and accepted. Leading by example with fair rules brings good fortune and respect."},{"legge":"The topmost SIX, divided, shows its subject enacting regulations severe and difficult. Even with firmness and correctness there will be evil. But though there will be cause for repentance, it will (by and by) disappear.","plain":"Harsh and bitter limits. Insisting on them brings misfortune, although regret will pass when you soften."}]},{"n":61,"zh":"中孚","pinyin":"Zhōng Fú","legge":"Kung Fû","name":"Inner Truth","alt":"Sincerity","glyph":"䷼","lower":"dui","upper":"xun","bits":"110011","keywords":["sincerity","trust","inner truth","empathy","influence"],"core":"a time when sincerity and inner truth create trust strong enough to move even the most difficult hearts","now":"Wind blows over the lake, stirring the water. Inner Truth describes sincerity so deep that it influences even pigs and fishes — the least responsive creatures. The text says it brings good fortune and that crossing the great water is beneficial. Real influence comes from truthful inner attitude. The Image advises the wise person to discuss criminal cases thoughtfully and delay executions — sincerity combined with understanding and mercy.","dir":"The situation may be moving toward a time when sincerity and inner truth create trust and influence.","do":["Be sincere and truthful","Listen with empathy","Build trust through consistency"],"avoid":["Hidden motives","Superficial influence"],"love":"Honesty and empathy build deep trust. Speak from the heart.","work":"Trust within the team is crucial. Be sincere and transparent.","self":"Connect with your inner truth.","jung":"Inner Truth may describe the connection between the ego and the Self — the inner center that provides genuine orientation and integrity.","example":"Building trust in a new relationship, mediating a conflict, or acting on your deepest convictions.","judgment":"Kung Fû (moves even) pigs and fish, and leads to good fortune. There will be advantage in crossing the great stream. There will be advantage in being firm and correct.","image":"(The trigram representing the waters of) a marsh and that for wind above it form Kung Fû. The superior man, in accordance with this, deliberates about cases of litigation and delays (the infliction of) death.","lines":[{"legge":"The first NINE, undivided, shows its subject resting (in himself). There will be good fortune. If he sought to any other, he would not find rest.","plain":"Being prepared and resting in yourself brings good fortune. If you look for security from others or follow hidden motives, you lose your peace."},{"legge":"The second NINE, undivided, shows its subject (like) the crane crying out in her hidden retirement, and her young ones responding to her. (It is as if it were said), 'I have a cup of good spirits,' (and the response were), 'I will partake of it with you.'","plain":"A crane calls from the shade, and its young answer. \"I have a good cup; I will share it with you.\" Sincere feeling finds an echo even at a distance."},{"legge":"The third SIX, divided, shows its subject having met with his mate. Now he beats his drum, and now he leaves off. Now he weeps, and now he sings.","plain":"Finding a companion, but swinging between beating the drum and stopping, weeping and singing. Depending on others for your mood makes you unstable."},{"legge":"The fourth SIX, divided, shows its subject (like) the moon nearly full, and (like) a horse (in a chariot) whose fellow disappears. There will be no error.","plain":"The moon is almost full; one horse of a pair goes its own way. Turn toward what is higher, even if it means leaving a companion. No blame."},{"legge":"The fifth NINE, undivided, shows its subject perfectly sincere, and linking (others) to him in closest union. There will be no error.","plain":"Sincerity that links people together. Genuine trust in leadership brings no blame."},{"legge":"The topmost NINE, undivided, shows its subject in chanticleer (trying to) mount to heaven. Even with firm correctness there will be evil.","plain":"A rooster trying to fly up to heaven. Grand words without inner substance. Persisting in this brings misfortune."}]},{"n":62,"zh":"小過","pinyin":"Xiǎo Guò","legge":"Hsiâo Kwo","name":"Preponderance of the Small","alt":"Small Exceeding","glyph":"䷽","lower":"gen","upper":"zhen","bits":"001100","keywords":["modesty","attention to detail","caution","small matters","humility"],"core":"a time when small matters and careful conduct are more important than great undertakings","now":"Thunder on the mountain: a sound that does not travel far. Preponderance of the Small describes a time when small things matter more than great ambitions. The text says success comes in small matters, not great ones. A flying bird brings a message: it is not good to strive upward; it is good to stay below. Be modest, careful and attentive to detail. The Image advises excess in reverence, mourning and thrift.","dir":"The situation may be moving toward a time when careful attention to small matters is more important than great ambitions.","do":["Focus on small, practical tasks","Be modest and careful","Pay attention to details"],"avoid":["Overambition","Ignoring small problems"],"love":"Small gestures of care matter more than grand declarations.","work":"Avoid big risks. Focus on details and small improvements.","self":"Take small, careful steps.","jung":"Preponderance of the Small may describe the importance of small, overlooked details — the minor symptoms or slips that reveal what the unconscious is trying to communicate.","example":"Double-checking work, being careful in a delicate situation, or focusing on small daily habits.","judgment":"Hsiâo Kwo indicates that (in the circumstances which it implies) there will be progress and attainment. But it will be advantageous to be firm and correct. (What the name denotes) may be done in small affairs, but not in great affairs. (It is like) the notes that come down from a bird on the wing;--to descend is better than to ascend. There will (in this way) be great good fortune.","image":"(The trigram representing) a hill and that for thunder above it form Hsiâo Kwo. The superior man, in accordance with this, in his conduct exceeds in humility, in mourning exceeds in sorrow, and in his expenditure exceeds in economy.","lines":[{"legge":"The first SIX, divided, suggests (the idea of) a bird flying, (and ascending) till the issue is evil.","plain":"A bird that flies too high meets with misfortune. Do not overreach; stay close to the ground for now."},{"legge":"The second SIX, divided, shows its subject passing by his grandfather, and meeting with his grandmother; not attempting anything against his ruler, but meeting him as his minister. There will be no error.","plain":"Passing by the grandfather and meeting the grandmother; not reaching the ruler but meeting his minister. Accept a modest role and the appropriate channel. No blame."},{"legge":"The third NINE, undivided, shows its subject taking no extraordinary precautions against danger; and some in consequence finding opportunity to assail and injure him. There will be evil.","plain":"Not taking special precautions can lead to someone attacking from behind. Be extra careful now; small oversights can cause big harm."},{"legge":"The fourth NINE, undivided, shows its subject falling into no error, but meeting (the exigency of his situation), without exceeding (in his natural course). If he go forward, there will be peril, and he must be cautious. There is no occasion to be using firmness perpetually.","plain":"No blame. Meet the situation as it is without going beyond it. Going forward is dangerous; be careful and do not insist stubbornly."},{"legge":"The fifth SIX, divided, (suggests the idea) of dense clouds, but no rain, coming from our borders in the west. It also (shows) the prince shooting his arrow, and taking the bird in a cave.","plain":"Dense clouds but no rain from the west. The prince shoots and takes the bird in its cave. You cannot accomplish everything now, but you can find capable helpers."},{"legge":"The sixth SIX, divided, shows its subject not meeting (the exigency of his situation), and exceeding (his proper course). (It suggests the idea of) a bird flying far aloft. There will be evil. The case is what is called one of calamity and self-produced injury.","plain":"Flying too high and passing the goal. Going beyond what is right brings misfortune and self-inflicted harm."}]},{"n":63,"zh":"既濟","pinyin":"Jì Jì","legge":"Kî Žî","name":"After Completion","alt":"Already Across","glyph":"䷾","lower":"li","upper":"kan","bits":"101010","keywords":["completion","maintenance","vigilance","balance","transition"],"core":"a time after completion, when everything seems in order but continued care is needed to prevent decline","now":"Water over fire: everything is in its proper place. After Completion describes a moment when a goal has been reached and order established. The text says success in small matters, and warns: at the beginning good fortune, at the end disorder. When things are complete, the danger is complacency. The Image advises the wise person to think of misfortune and take precautions in advance. Maintain what you have achieved.","dir":"The situation may be moving toward completion. Stay vigilant and maintain what you have achieved.","do":["Maintain what you have achieved","Stay alert for problems","Plan for future changes"],"avoid":["Complacency","Assuming success is permanent"],"love":"The relationship may feel settled. Keep nurturing it so that it stays alive.","work":"A project has been completed. Now focus on maintenance and quality.","self":"Celebrate your achievement, but do not stop growing.","jung":"After Completion may describe a state of psychological balance that, like all states, is temporary. The psyche is always in motion, and stability must be renewed.","example":"Finishing a degree, completing a major project, or reaching a long-sought goal.","judgment":"Kî Žî intimates progress and success in small matters. There will be advantage in being firm and correct. There has been good fortune in the beginning; there may be disorder in the end.","image":"(The trigram representing) fire and that for water above it form Kî Žî. The superior man, in accordance with this, thinks of evil (that may come), and beforehand guards against it.","lines":[{"legge":"The first NINE, undivided, (shows its subject as a driver) who drags back his wheel, (or as a fox) which has wet his tail. There will be no error.","plain":"Braking the wheels; the fox gets its tail wet. Slowing down at the start of a new phase prevents greater trouble. No blame."},{"legge":"The second SIX, divided, (shows its subject as) a wife who has lost her (carriage-)screen. There is no occasion to go in pursuit of it. In seven days she will find it.","plain":"A woman loses the curtain of her carriage. Do not chase what is lost; in seven days it will return by itself."},{"legge":"The third NINE, undivided, (suggests the case of) Kâo Žung, who attacked the Demon region, but was three years in subduing it. Small men should not be employed (in such enterprises).","plain":"A long campaign against a distant land takes three years. Great tasks after a success are exhausting. Do not give responsibility to petty people."},{"legge":"The fourth SIX, divided, shows its subject with rags provided against any leak (in his boat), and on his guard all day long.","plain":"Even the finest garments can turn to rags; a leaking boat needs patching. Stay alert all day to avoid disaster."},{"legge":"The fifth NINE, undivided, shows its subject (as) the neighbour in the east who slaughters an ox (for his sacrifice); but this is not equal to the (small) spring sacrifice of the neighbour in the west, whose sincerity receives the blessing.","plain":"A neighbour who sacrifices an ox gains less than one who makes a small, sincere offering. Sincerity counts more than show."},{"legge":"The topmost SIX, divided, shows its subject with (even) his head immersed. The position is perilous.","plain":"Getting your head wet as you cross. Overconfidence at the end brings danger."}]},{"n":64,"zh":"未濟","pinyin":"Wèi Jì","legge":"Wei Žî","name":"Before Completion","alt":"Not Yet Across","glyph":"䷿","lower":"kan","upper":"li","bits":"010101","keywords":["transition","incompleteness","caution","potential","hope"],"core":"a time just before completion, when caution and careful discernment can still bring success","now":"Fire over water: nothing is yet in its proper place. Before Completion is the final hexagram, but it describes a situation that is not yet complete. The text pictures a little fox that has almost crossed the river but gets its tail wet. Success is possible, but only with great care. Separate things carefully and put each in its place. The transition is not yet finished; do not relax too early.","dir":"The situation may be moving toward a transition that is not yet complete. Careful discernment and patience will help you finish well.","do":["Proceed carefully through the final steps","Sort things out and put them in order","Stay hopeful but cautious"],"avoid":["Relaxing too early","Carelessness at the end"],"love":"The relationship is still developing. Do not take anything for granted.","work":"The project is almost done but not finished. Pay attention to the final details.","self":"You are in transition. Be patient and careful as you complete it.","jung":"Before Completion may describe the ongoing nature of psychological development: individuation is never finished. Each completion opens a new beginning.","example":"The final stage of a long project, the last months of a degree, or the period just before a major life change.","judgment":"Wei Žî intimates progress and success (in the circumstances which it implies). (We see) a young fox that has nearly crossed (the stream), when its tail gets immersed. There will be no advantage in any way.","image":"(The trigram representing) water and that for fire above it form Wei Žî. The superior man, in accordance with this, carefully discriminates among (the qualities of) things, and the (different) positions they (naturally) occupy.","lines":[{"legge":"The first SIX, divided, shows its subject (like a fox) whose tail gets immersed. There will be occasion for regret.","plain":"Getting your tail wet. Rushing ahead before you are ready brings embarrassment."},{"legge":"The second NINE, undivided, shows its subject dragging back his (carriage-) wheel. With firmness and correctness there will be good fortune.","plain":"Braking the wheels. Holding back and waiting for the right time brings good fortune."},{"legge":"The third SIX, divided, shows its subject, with (the state of things) not yet remedied, advancing on; which will lead to evil. But there will be advantage in (trying to) cross the great stream.","plain":"Before completion, attacking now brings misfortune. Instead, it is good to make a larger journey to reach new conditions."},{"legge":"The fourth NINE, undivided, shows its subject by firm correctness obtaining good fortune, so that all occasion for repentance disappears. Let him stir himself up, as if he were invading the Demon region, where for three years rewards will come to him (and his troops) from the great kingdom.","plain":"Steady correctness brings good fortune and regret disappears. Determined effort over a long time, like a three-year campaign, is rewarded."},{"legge":"The fifth SIX, divided, shows its subject by firm correctness obtaining good fortune, and having no occasion for repentance. (We see in him) the brightness of a superior man, and the possession of sincerity. There will be good fortune.","plain":"Steady correctness brings good fortune without regret. The light of a good person shines with sincerity."},{"legge":"The topmost NINE, undivided, shows its subject full of confidence and therefore feasting (quietly). There will be no error. (If he) cherish this confidence, till he (is like the fox who) gets his head immersed, it will fail of what is right.","plain":"Celebrating with confidence and trust is fine. But if you overindulge and lose your head, you lose what you have gained."}]}]};window.__ICHING_STANDALONE=true;</script>

<p class="lede">The I Ching (\u6613\u7D93, <i>Y\xECj\u012Bng</i>, the "Classic of Changes") is one of the oldest books in the world still in daily use. It began as a manual for divination and grew, over a thousand years of commentary, into one of the great works of Chinese philosophy.</p>
<h3>Ancient origins</h3>
<p>Long before the book existed, rulers of the Shang dynasty (c. 1600\u20131046 BCE) consulted ancestors and spirits by heating turtle shells and ox bones and reading the cracks. Under the Zhou dynasty, a different method spread: sorting stalks of the yarrow plant to obtain numbers, which were written as lines. The core text, called the <b>Zh\u014Duy\xEC</b> (\u5468\u6613, "Changes of Zhou"), took shape during the Western Zhou period, roughly 1000\u2013750 BCE. It consists of 64 six-line figures, each with a short Judgment and six line statements full of vivid images: dragons, foxes crossing rivers, wells, cauldrons, wild geese.</p>
<h3>Legend and evidence</h3>
<p>Tradition credits four sages. The mythical culture-hero <b>Fu Xi</b> is said to have discovered the eight trigrams by observing patterns in heaven and earth. <b>King Wen</b> of Zhou (11th century BCE) is said to have doubled them into 64 hexagrams and written the Judgments while imprisoned. His son, the <b>Duke of Zhou</b>, is credited with the line statements, and <b>Confucius</b> (551\u2013479 BCE) with the commentaries known as the Ten Wings.</p>
<p>Modern scholars treat these attributions as legend. The text shows signs of gradual compilation by diviners over generations. The oldest surviving manuscripts are a bamboo-slip version of about 300 BCE (now in the Shanghai Museum) and a silk manuscript from a tomb at Mawangdui sealed in 168 BCE, which arranges the hexagrams in a different order. The Ten Wings were written by several hands between roughly the 4th and 2nd centuries BCE, probably well after Confucius.</p>
<h3>The Ten Wings: from oracle to philosophy</h3>
<p>The <b>Ten Wings</b> (\u5341\u7FFC) are seven commentaries, three of them in two parts. They explain the Judgments, interpret the trigram "Images", discuss the first two hexagrams in depth, describe the symbolism of each trigram, justify the order of the hexagrams and, above all in the <i>Great Treatise</i> (\u7E6B\u8FAD, X\xECc\xED), present a whole philosophy of change: "In the Changes there is the Great Ultimate, which produces the two forms..." With these commentaries attached, the book became a classic. In 136 BCE the Han emperor Wu made it one of the official Five Classics of Confucian learning, and for two thousand years every educated person in China studied it.</p>
<h3>Yin and yang</h3>
<p>The I Ching is built from two kinds of line: a solid line <b>\u268A</b> (yang: firm, active, light) and a broken line <b>\u268B</b> (yin: yielding, receptive, dark). They are not good and evil, or male and female in a simple sense, but complementary phases that turn into one another, like day and night or breathing in and out. Each contains the seed of the other, and the extreme of one gives way to the other. That is exactly what a "changing line" shows.</p>
<h3>Eight trigrams, sixty-four hexagrams</h3>
<p>Three lines, each yin or yang, can be combined in 2 \xD7 2 \xD7 2 = 8 ways: the eight trigrams (\u516B\u5366, b\u0101gu\xE0), associated with heaven, earth, thunder, wind, water, fire, mountain and lake. Two trigrams stacked together make a hexagram, and there are 8 \xD7 8 = 64 of them, covering every possible combination of six lines. The lower trigram is traditionally the inner or earlier part of a situation, and the upper trigram the outer or later part.</p>
<h3>The King Wen sequence</h3>
<p>The received order of the 64 hexagrams is called the King Wen sequence. It begins with pure yang (1, The Creative) and pure yin (2, The Receptive) and ends with After Completion (63) and Before Completion (64), so that the book closes on something unfinished: change never ends. The hexagrams come in pairs. In 28 pairs, the second hexagram is the first turned upside down; in the remaining 4 pairs, whose figures look the same upside down, every line is reversed instead.</p>
<h3>Taoist and Confucian readings</h3>
<p>Both great native traditions of Chinese thought claimed the book. <b>Confucian</b> scholars read it as a guide to moral conduct and good government: the recurring "superior person" (\u541B\u5B50, j\u016Bnz\u01D0) is someone who reads the times and responds with integrity. <b>Taoist</b> thinkers shared its vision of a world in constant flow, where wisdom lies in yielding to the natural course (the Dao) instead of forcing it. The philosopher Wang Bi (226\u2013249 CE) wrote a deeply influential philosophical commentary, and in the Song dynasty Zhu Xi (1130\u20131200) restored attention to its divinatory use and set down the rules for reading changing lines that this app follows.</p>
<h3>Leibniz and binary numbers</h3>
<p>In 1701 the Jesuit missionary Joachim Bouvet sent the German philosopher <b>Gottfried Wilhelm Leibniz</b> a diagram of the 64 hexagrams arranged in the order associated with Fu Xi (the arrangement of the 11th-century thinker Shao Yong). Leibniz, who had developed binary arithmetic, saw that if a broken line is read as 0 and a solid line as 1, the sequence counts from 0 to 63. He published his "Explanation of Binary Arithmetic" in 1703, mentioning the hexagrams. The ancient Chinese authors did not think of the figures as binary numbers, but the structure is mathematically the same: six binary digits give 2\u2076 = 64 possibilities.</p>
<h3>Arrival in the West</h3>
<p>Jesuit missionaries brought knowledge of the book to Europe in the 17th century, and a Latin translation prepared by Jean-Baptiste R\xE9gis and colleagues was published in the 1830s. <b>James Legge</b>'s English translation appeared in 1882 as volume 16 of the <i>Sacred Books of the East</i>; it is the translation quoted in this app. In 1924 <b>Richard Wilhelm</b> published a German translation shaped by years in China and by his teacher Lao Naixuan. Cary F. Baynes's English version of Wilhelm (1950), with a foreword by Carl Jung, made the I Ching famous in the West and inspired writers, composers and artists from John Cage to Philip K. Dick.</p>
<h3>A philosophy of change</h3>
<p>Beneath its use as an oracle, the I Ching offers a way of seeing: every situation is a moment in a process; strength and weakness, advance and retreat, have their right times; small beginnings grow; extremes reverse. Its practical wisdom is about timing, balance, relationships and conduct, which is why people still return to it whether or not they believe in divination.</p>`,Oe=`
<p class="lede">The Swiss psychiatrist <b>Carl Gustav Jung</b> (1875\u20131961) did more than anyone to bring the I Ching to Western readers, not as a fortune-telling device but as a tool for self-reflection.</p>
<h3>Wilhelm, Baynes and Jung</h3>
<p>Richard Wilhelm's German translation, <i>I Ging: Das Buch der Wandlungen</i>, was published in <b>1924</b>. Jung, who had been experimenting with the I Ching since the early 1920s, became Wilhelm's friend and invited him to lecture in Zurich. After Wilhelm's death in 1930, Jung encouraged his student <b>Cary F. Baynes</b> to translate Wilhelm's version into English. Jung wrote a foreword for it in <b>1949</b>, and the English translation was published in <b>1950</b> (Bollingen Series XIX).</p>
<h3>Summary of Jung's foreword</h3>
<p>Jung begins by admitting he is not a sinologist, so he can only describe his own experience. He contrasts Western science, which isolates causes and repeats experiments, with the Chinese view captured by the I Ching, which looks at the whole of a moment: everything that happens at the same time is taken to share the quality of that moment. Casting coins is a way of "reading" that moment.</p>
<p>To demonstrate, Jung did something unusual: he asked the I Ching what it thought of his plan to present it to Western readers, as though the book were a person. He obtained <b>Hexagram 50, The Cauldron</b> (a sacred vessel holding nourishment), with changing lines in the second and third places. He read this as the book describing itself: a vessel of spiritual nourishment whose "handle" (the concept by which it is grasped) had been altered, so that people no longer understood it. The resulting hexagram, <b>35, Progress</b>, suggested a new hearing. He also asked about his own action in writing the foreword and received <b>Hexagram 29, The Abysmal</b>, with a changing third line, which he took as a fitting warning about the difficulties and dangers of the task.</p>
<p>Jung is careful and candid throughout. He says the oracle cannot be proven, that a sceptic may see only projection, and that the reader must judge for themselves. What matters, he argues, is that the book insists on self-knowledge, and that its value can only be found through one's own experience. As he puts it near the end: "The I Ching does not offer itself with proofs and results; it does not vaunt itself, nor is it easy to approach. Like a part of nature, it waits until it is discovered." (You can try Jung's two consultations in this app: Hexagram 50 with lines 2 and 3, and Hexagram 29 with line 3.)</p>

<h3>Synchronicity</h3>
<p>Jung first used the word <b>synchronicity</b> publicly in a 1930 memorial lecture for Richard Wilhelm, and later developed it in his essay <i>Synchronicity: An Acausal Connecting Principle</i> (1952), written in dialogue with the physicist Wolfgang Pauli. He defined it as a <b>meaningful coincidence</b>: two events that are not linked by cause and effect, but are linked by meaning for the person who experiences them. His famous example: a patient was describing a dream about a golden scarab when a scarab-like beetle tapped on the window.</p>
<h3>Causes and meaningful coincidences</h3>
<p>A <b>causal</b> connection means one event produces another: rain makes the street wet. A <b>synchronistic</b> connection, in Jung's sense, means an outer event (such as the fall of three coins) and an inner state (your question, your mood, your situation) coincide in a way that feels meaningful, without one causing the other. Jung proposed that the I Ching works on this principle. This is a philosophical and psychological hypothesis. It is <b>not an established scientific mechanism</b>, and there is no scientific evidence that the coins can predict future events.</p>
<h3>Symbols, archetypes and the unconscious</h3>
<p>Jung believed the mind contains not only a personal unconscious but a <b>collective unconscious</b>: deep, shared patterns he called <b>archetypes</b>, such as the mother, the hero, the shadow and the wise old person. The I Ching's images (the dragon, the well, the abyss, the cauldron) are rich, ancient symbols that can resonate with these patterns. When a reading "hits home", Jung would say a symbol has touched something in you that was already active below the surface.</p>
<h3>Using a consultation for reflection</h3>

<h3>1. What is the I Ching?</h3>
<p>An ancient Chinese book of 64 short chapters, each built around a six-line figure called a hexagram. Each hexagram describes a type of situation (beginning, conflict, waiting, abundance, retreat...) and how to act wisely within it. For 3,000 years people have "consulted" it by asking a question and producing a hexagram by chance.</p>
<h3>2. How to ask a question</h3>
<p>Open questions work best: <i>"What should I understand about...?"</i>, <i>"How should I approach...?"</i>, <i>"What is the wisest attitude toward...?"</i>. Yes/no questions and requests for exact predictions work poorly, because the I Ching describes tendencies and attitudes, not fixed outcomes. Broad questions are fine. You can also simply hold your situation in mind without typing anything.</p>
<h3>3. How to cast the coins</h3>
<p>Tap <b>Cast</b> (or shake your phone, if you turn that on). Three coins are tossed. The inscribed side counts 2 (yin) and the plain side counts 3 (yang), so each toss totals 6, 7, 8 or 9:</p>

<h3>5. Yin and yang</h3>
